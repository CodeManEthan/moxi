# The connector's config schema. The file it governs is CONFIG/connector/config.toml;
# `moxi config connector` shows every key. None of them is a secret.

[enabled]
type = "bool"
default = false
doc = "The daemon's switch: on, the public MCP door runs and its socket unit holds the port."
label = "The public door"
read = "use"
terminal = { on = "moxi connector enable", off = "moxi connector disable" }

[port]
type = "int"
default = 8452
doc = "The loopback port the door listens on, and the port tunnel's connector/mcp forwards to."
read = "start"
label = "Port"

[public_url]
type = "string"
default = ""
doc = "The public origin (https://<name>[:<port>], no path) when no tunnel gives one. Empty reads tunnel's connector/mcp."
read = "use"
label = "Public address"
line = "The public origin, https://name:port with no path, when no tunnel gives one."

[redirect_uris]
type = "list"
items = "str"
default = ["https://claude.ai/api/mcp/auth_callback", "https://claude.com/api/mcp/auth_callback"]
doc = "The callbacks a client may register for its sign-in codes."
read = "start"
label = "Sign-in callbacks"
line = "The callbacks a client may register for its sign-in codes."

[refresh_days]
type = "int"
default = 30
doc = "How many days a sign-in lasts after its last refresh."
read = "start"
label = "A sign-in lasts for"
line = "After its last refresh."
unit = "days"

[tools.withheld]
type = "list"
items = "str"
default = []
doc = "Tool names the door serves to no grant: left out of the tool list, and a call to one answers as an unknown tool. Read at the start; restart the connector (moxi connector disable, then enable) to change it."
read = "start"
label = "Tools withheld from Claude"
line = "Left out of the tool list Claude sees. Read when the connector starts."
