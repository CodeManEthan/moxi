[project]
name = "moxi-connector"
version = "0.1.0"
description = "The public MCP door for the Claude apps: the listener, the sign-in, the address and the tools other modules provide."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
keywords = ["mcp", "claude", "connector", "agents", "oauth"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
# The core gives the daemon behind its switch, the settings, the doctor, the control
# socket and the call log's writer (0.1.3 is the first whose append_record refuses field
# names and collapses busy classes). mcp is the SDK the door serves MCP with, and uvicorn the HTTP server it runs on:
# both required, since the door is the module's whole purpose. Their ranges are the ones
# comms pins for its own tools, so one environment holds one of each. jsonschema, which
# mcp brings anyway, checks a tool call's arguments against the provider's schema before
# the provider sees them.
dependencies = ["moxi>=0.1.3,<0.2", "mcp>=2.3,<3", "uvicorn>=0.54,<1", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
# The public address comes from tunnel's record of `connector/mcp`. Without tunnel the
# address is `public_url`, typed by hand, or none.
tunnel = ["moxi-tunnel>=0.2,<0.3"]

[project.urls]
Homepage = "https://github.com/CodeManEthan/moxi"
Repository = "https://github.com/CodeManEthan/moxi"
Issues = "https://github.com/CodeManEthan/moxi/issues"

# The daemon: the public MCP door, run by the core's writer behind the `enabled` switch.
[project.scripts]
moxi-connector-server = "moxi_connector.daemon:main"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
connector = "moxi_connector.module"

# The one public target: tunnel gives it its address.
[project.entry-points."moxi.tunnel"]
"connector.mcp" = "moxi_connector.tunnel:MCP"

[dependency-groups]
dev = ["pytest", "moxi-dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package directory whole, so settings.toml ships beside the code.
packages = ["src/moxi_connector"]

[tool.hatch.build.targets.sdist]
# A source distribution holds these paths and nothing else.
only-include = ["LICENSE", "README.md", "conftest.py", "src/moxi_connector", "tests"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus a tier test whose `touches` glob matches a
# changed path; `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1). Mark a test that asserts
# a wall-clock budget `timed`: the check runs it alone, after the parallel pass.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
