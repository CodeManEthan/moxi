[project]
name = "moxi-cache"
version = "0.1.1"
description = "Know when a session's prompt cache goes cold, and act before it does."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
dependencies = ["moxi>=0.1,<0.2", "moxi-sessions>=0.2,<0.3"]

[project.optional-dependencies]
# The browser UI shell: with it, cache's panel and its chip show there. Loopback, which
# cache's page server runs on, comes with it.
ui = ["moxi-ui>=0.1,<0.2"]

[project.urls]
Homepage = "https://github.com/moxihq/moxi"
Repository = "https://github.com/moxihq/moxi"
Issues = "https://github.com/moxihq/cache/issues"

# Only the core declares the `moxi` script; this is the watcher's own entry point.
[project.scripts]
moxi-cache-watch = "moxi_cache.watch:main"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
cache = "moxi_cache.module"

[dependency-groups]
# moxi-ui's pytest plugin runs cache's pages in a real shell; its testing extra brings
# the browser. The browser tests import Playwright themselves, so it is named too.
dev = ["pytest", "moxi-dev", "moxi-ui[testing]", "playwright>=1.56,<2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_cache"]

[tool.hatch.build.targets.sdist]
# A source distribution built from any branch holds these public paths, and the
# pyproject.toml and .gitignore hatchling adds itself.
only-include = ["LICENSE", "README.md", "src/moxi_cache", "tests", "web"]

# A plain `pytest` leaves out the browser tests, and so does `moxi-dev check` when
# Playwright's Chromium can't start; `pytest -m browser` runs them.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser'"
markers = ["browser: drives a browser; deselected by a plain pytest run"]
