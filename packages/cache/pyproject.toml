[project]
name = "moxi-cache"
version = "0.1.3"
description = "Know when a session's prompt cache goes cold, and act before it does."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
dependencies = ["moxi>=0.1.6,<0.2", "moxi-sessions>=0.2,<0.3"]

[project.optional-dependencies]
# The browser UI shell: with it, cache's panel and its chip show there.
ui = ["moxi-ui>=0.2,<0.3"]

[project.urls]
Homepage = "https://github.com/CodeManEthan/moxi"
Repository = "https://github.com/CodeManEthan/moxi"
Issues = "https://github.com/CodeManEthan/moxi/issues"

# Only the core declares the `moxi` script; this is the watcher's own entry point.
[project.scripts]
moxi-cache-watch = "moxi_cache.watch:main"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
cache = "moxi_cache.module"

[dependency-groups]
# moxi-ui's pytest plugin runs cache's pages in a real shell; its testing extra brings
# the browser. The browser tests import Playwright themselves, so it is named too.
dev = ["pytest", "moxi-dev", "moxi-ui[testing]", "playwright>=1.56,<2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_cache"]

[tool.hatch.build.targets.sdist]
# A source distribution built from any branch holds these public paths, and the
# pyproject.toml and .gitignore hatchling adds itself.
only-include = ["CHANGELOG.md", "LICENSE", "README.md", "conftest.py", "src/moxi_cache",
                "tests", "web"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus the browser tests when Playwright's Chromium
# starts there, plus a tier test whose `touches` glob matches a changed path;
# `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
