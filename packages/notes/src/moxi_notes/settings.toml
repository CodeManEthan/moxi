# The notes module's config schema. The file it governs is CONFIG/notes/config.toml;
# `moxi config notes` shows every key and `moxi config notes init` writes the file.
# Every key is read at its use, so an edit takes effect at the next read.

[root]
type = "path"
default = "~/notes"
doc = "The folder that holds your notes. A git repo for snapshots. ~ is your home on every OS."
read = "use"
label = "Notes folder"
line = "A git repo, for snapshots. ~ is your home on every OS."

[prefix]
type = "string"
default = ""
doc = "A subfolder under the root that holds the computed folders, topics and inbox, such as your user name. Empty puts them at the root."
read = "use"
label = "Subfolder for folders, topics and inbox"
line = "Under the notes folder, such as your user name. Not set: the notes folder itself."

[exclude]
type = "list"
items = "str"
default = []
doc = "Folders whose sessions get no notes directory. Each an absolute path, or one starting with ~."
read = "use"
label = "Folders with no notes"
line = "Sessions in these folders get no notes directory. Each an absolute path, or one starting with ~."

[action]
type = "enum"
values = ["leave-out", "redact"]
default = "leave-out"
doc = "What a commit does with a file that holds a secret: leave the file out, or commit a redacted copy."
read = "use"
label = "A file that holds a secret"
line = "What a commit does with it: leave the file out, or commit a redacted copy."
choices = { "leave-out" = "leave it out", redact = "redact it" }

[max_mib]
type = "int"
default = 10
doc = "Largest file, in MiB, a snapshot takes and a git hook gate reads."
read = "use"
label = "Largest file a snapshot takes"
line = "And the largest a git hook's gate reads."
unit = "MiB"

[types]
type = "string"
default = "doc-types.toml"
doc = "The document types file, relative to the root."
read = "use"
label = "Document types file"
line = "Relative to the notes folder."

[snapshot.session_end]
type = "bool"
default = true
doc = "Snapshot when an agent session's turn ends or the session ends."
read = "use"
label = "Snapshot at a session's end"
line = "When an agent session's turn ends, or the session ends."

[snapshot.interval_minutes]
type = "int"
default = 15
doc = "At most one snapshot commit per this many minutes."
read = "use"
label = "At most one snapshot every"
unit = "minutes"

[snapshot.push]
type = "string"
default = ""
doc = "The remote to push to after a snapshot; empty means no push."
read = "use"
label = "Push snapshots to"
line = "A git remote. Not set: no push."

[snapshot.author_name]
type = "string"
default = "moxi notes"
doc = "The name on snapshot commits."
read = "use"
label = "Name on snapshot commits"

[snapshot.author_email]
type = "string"
default = ""
doc = "The email on snapshot commits; empty means notes+<device>@moxi.invalid, one per machine."
read = "use"
label = "Email on snapshot commits"
line = "Not set: notes+<device>@moxi.invalid, one per machine."

[snapshot.timer]
type = "bool"
default = false
doc = "Commit a snapshot on a timer, outside agent sessions, as well."
read = "use"
label = "Snapshot on a timer"
line = "Outside agent sessions, as well."

# Keys an earlier notes read, kept declared so a file that still sets one is told what to
# do rather than refused as unknown.

[max_mb]
retired = "renamed: set max_mib instead"

[snapshot.auto]
retired = "renamed: set snapshot.session_end instead"

[snapshot.interval]
retired = "renamed: set snapshot.interval_minutes instead"
