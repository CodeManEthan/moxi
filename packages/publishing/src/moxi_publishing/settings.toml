# The publishing module's config schema. The file it governs is CONFIG/publishing/config.toml;
# `moxi config publishing` shows every key and `moxi config publishing init` writes the file.
# Every key is read at its use. A value that can differ between repos is not here: it is a
# piece setting in that repo's own git config, and the `defaults.*` keys only seed those
# settings when `moxi publishing enable` or `clean-history enable` first registers a piece
# in a repo, or adds to its commit-rules piece.

[provenance.rules]
type = "list"
items = "str"
default = ["session-link", "session-pointer", "message-id", "quoted-ruling", "ruling-tag", "round-pointer"]
doc = "Which provenance rules run on commit messages and files. Remove one to switch it off."
read = "use"
label = "Provenance rules that run"
line = "Shapes that point into notes, sessions or messages, refused in commit messages and files."
hurts = { when = "remove", says = "switches this rule off", confirm = "From the next commit or push, text of this rule's shape can go into a public repo without a refusal." }

[push.word_pattern]
type = "string"
default = '^\S+$'
doc = "The regular expression a push word (MOXI_PUBLISHING_PUSH_WORD) must match in full."
read = "use"
label = "What a push word must look like"
line = "A regular expression MOXI_PUBLISHING_PUSH_WORD must match in full."

[defaults.drop_trailers]
type = "list"
items = "str"
default = ["Claude-Session", "Commit-Check"]
doc = "Seeds a repo's drop-trailer setting when enable first registers the message piece there: trailer keys removed at commit. A key on the repo's pass-trailer is never dropped."
read = "use"
label = "Trailers to drop, for a new repo"
line = "Copied in when enable first registers the message piece in a repo; a later change reaches no repo that has it."

[defaults.refused_trailers]
type = "list"
items = "str"
default = ["Round", "Reconciles"]
doc = "Trailer keys clean history adds to a repo's commit-rules piece as its refused-trailer setting, registering the piece where it isn't: the trailers Moxi's rounds writes for its own records. Keys the repo already refuses are kept; nothing is replaced."
read = "use"
label = "Trailers a clean repo refuses"
line = "Added to the repo's refused-trailer setting when clean history is turned on there; a later change reaches no repo that has it."

[defaults.main]
type = "string"
default = "main"
doc = "Seeds a repo's main setting when enable first registers the push piece there: the branch deletions are judged against."
read = "use"
label = "The main branch, for a new repo"
line = "Copied in when enable first registers the push piece in a repo: the branch deletions are judged against."

[defaults.word_required]
retired = "remove it: the push word is push approval's now (moxi publishing approval enable PATH --branch PATTERN)"
left_out = true

[project_add.clean_history]
type = "enum"
values = ["ask", "yes", "no"]
default = "ask"
doc = "What `moxi projects add` does about clean history for a new project whose root is in a git repo: ask (the add asks in a terminal, suggesting yes, and names the command otherwise), yes (turn it on, asking nothing) or no (leave it off, asking nothing)."
read = "use"
label = "Clean history at project add"
line = "Whether adding a project asks to keep its repo's history publishable, or answers for you."

[project_add.push_approval]
type = "enum"
values = ["ask", "yes", "no"]
default = "ask"
doc = "What `moxi projects add` does about push approval for a new project whose root is in a git repo: ask (the add asks in a terminal, suggesting no, and names the command otherwise), yes (turn it on for project_add.approval_branches, asking for branches in a terminal when none are listed) or no (leave it off, asking nothing)."
read = "use"
label = "Push approval at project add"
line = "Whether adding a project asks to guard agents' pushes to some branches, or answers for you."

[project_add.approval_branches]
type = "list"
items = "str"
default = []
doc = "The branch patterns push approval guards when project_add.push_approval is yes (`*`, `?` and `[...]` over the branch name). Empty: the add asks for them in a terminal, and without one turns nothing on and says so."
read = "use"
label = "Branches guarded at project add"
line = "The branches a new project's push approval guards when it is turned on for you."
