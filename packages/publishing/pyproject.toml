[project]
name = "moxi-publishing"
version = "0.1.0"
description = "Keep private text out of a public git repo, and release its packages: a public flag, three git hook pieces and per-package release tags."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
keywords = ["git", "hooks", "publishing", "releases", "secrets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
# repo runs the git hook pieces; secrets holds the pattern sets and lists they read.
# packaging reads the versions and requirements a release is judged by.
dependencies = ["moxi>=0.1.9,<0.2", "moxi-repo>=0.1.2,<0.2", "moxi-secrets>=0.1,<0.2",
                "packaging"]

[project.urls]
Homepage = "https://github.com/CodeManEthan/moxi"
Repository = "https://github.com/CodeManEthan/moxi"
Issues = "https://github.com/CodeManEthan/moxi/issues"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
publishing = "moxi_publishing.module"

# The four git hook pieces, each declared beside the function it runs.
[project.entry-points."moxi.repo.git_hooks"]
"publishing.message" = "moxi_publishing.message:MESSAGE"
"publishing.content" = "moxi_publishing.content:CONTENT"
"publishing.push" = "moxi_publishing.push:PUSH"
"publishing.approval" = "moxi_publishing.approval:APPROVAL"

# projects reads the questions `moxi projects add` puts, and acts on their answers, from
# here; publishing never imports projects.
[project.entry-points."moxi.projects"]
publishing = "moxi_publishing.projects_link"

[dependency-groups]
dev = ["pytest", "moxi-dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_publishing"]

[tool.hatch.build.targets.sdist]
# A source distribution holds these paths and nothing else.
only-include = ["CHANGELOG.md", "LICENSE", "README.md", "conftest.py",
                "src/moxi_publishing", "tests"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus a tier test whose `touches` glob matches a
# changed path; `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
