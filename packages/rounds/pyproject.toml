[project]
name = "moxi-rounds"
version = "0.1.0"
description = "Moxi's rounds: a piece of work tracked from design to landing, with its questions, rulings, builds and gates."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
keywords = ["rounds", "agents", "git", "claude-code", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
# projects names a round's home and the repo each build is in.
dependencies = ["moxi>=0.1.7,<0.2", "moxi-projects>=0.1.4,<0.2"]

[project.optional-dependencies]
# notes: with it, a project that names no notes folder gets notes' default one, so its
# rounds folder may be relative.
notes = ["moxi-notes>=0.1,<0.2"]

[project.urls]
Homepage = "https://github.com/CodeManEthan/moxi"
Repository = "https://github.com/CodeManEthan/moxi"
Issues = "https://github.com/CodeManEthan/moxi/issues"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
rounds = "moxi_rounds.module"

[dependency-groups]
dev = ["pytest", "moxi-dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_rounds"]

[tool.hatch.build.targets.sdist]
# A source distribution holds these paths and nothing else.
only-include = ["CHANGELOG.md", "LICENSE", "README.md", "conftest.py",
                "src/moxi_rounds", "tests"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus a tier test whose `touches` glob matches a
# changed path; `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
