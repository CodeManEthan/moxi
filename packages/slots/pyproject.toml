[project]
name = "moxi-slots"
version = "0.1.0"
description = "Numbered tmux sessions to launch into, on one supervised tmux server."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
keywords = ["tmux", "sessions", "agents", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Terminals",
]
dependencies = ["moxi>=0.1.6,<0.2"]

[project.urls]
Homepage = "https://github.com/CodeManEthan/moxi"
Repository = "https://github.com/CodeManEthan/moxi"
Issues = "https://github.com/CodeManEthan/moxi/issues"

# Only the core declares the `moxi` script; the module's commands run as `moxi slots <verb>`.
# The server wrapper, which the core's writer installs as the module's daemon, and the
# trampoline every launch's pane runs first are its two scripts; neither is run by hand.
[project.scripts]
moxi-slots-server = "moxi_slots.server:main"
moxi-slots-exec = "moxi_slots.trampoline:main"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
slots = "moxi_slots.module"

[dependency-groups]
dev = ["pytest", "moxi-dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_slots"]

[tool.hatch.build.targets.sdist]
# A source distribution holds these paths and nothing else.
only-include = ["CHANGELOG.md", "LICENSE", "README.md", "conftest.py", "src/moxi_slots", "tests"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus a tier test whose `touches` glob matches a
# changed path; `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
