[project]
name = "moxi-launcher"
version = "0.1.0"
description = "Launch Claude Code and Codex sessions from presets over a per-harness flag catalog, in this terminal, headless or in a tmux slot, and log every launch."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
# The launcher requires the core only. Every other module it works with (turns, comms,
# slots, projects, notes, usage, loadout, ui) is an optional link it reaches through
# moxi.modules.load where a feature needs it, and never imports.
dependencies = ["moxi>=0.1,<0.2"]

[project.optional-dependencies]
# The first turn, readiness, Codex ids, and the start listeners.
turns = ["moxi-turns>=0.2,<0.3"]
# Identities, scopes, directors, the with: posture and the console name.
comms = ["moxi-comms>=0.2,<0.3"]
# Project keys for a launch's place, a directory's key on its row, and a project's agents.
projects = ["moxi-projects>=0.1,<0.2"]
# The tmux slot target, and the startup screens answered there.
slots = ["moxi-slots>=0.1,<0.2"]
# The browser UI shell: with it, the launcher's page shows there. Loopback, which the
# launcher's page server runs on, comes with it.
ui = ["moxi-ui>=0.1,<0.2"]

[project.urls]
Homepage = "https://github.com/moxihq/moxi"
Repository = "https://github.com/moxihq/moxi"
Issues = "https://github.com/moxihq/moxi/issues"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
launcher = "moxi_launcher.module"

# The ready recorder, the Codex seat listener and the handoff pointer, called by turns in
# a session's endpoint process.
[project.entry-points."moxi.turns.listeners"]
launcher = "moxi_launcher.listeners"

# The launcher's subscriptions to cache's timer (recycle on expiry, keep-warm), read by
# cache's watcher. usage's crossings group gets the crossing handler once usage is built.
[project.entry-points."moxi.cache.timers"]
launcher = "moxi_launcher.cachetimers"

# The launcher's commands run as `moxi launcher <verb>` (only the core declares `moxi`),
# the detached first-turn sender (`moxi launcher deliver`) among them. One console script
# of its own: the detached runs (a relaunch, a repair, an expiry or keep-warm ask, a limit
# compact), spawned and never typed, found through `moxi.paths.script`.
[project.scripts]
moxi-launcher-job = "moxi_launcher.job:main"

[dependency-groups]
# moxi-ui's pytest plugin runs the launcher's page in a real shell; its testing extra brings
# the browser. The browser tests import Playwright themselves, so it is named too.
dev = ["pytest", "moxi-dev", "moxi-ui[testing]", "playwright>=1.56,<2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_launcher"]

[tool.hatch.build.targets.sdist]
# A source distribution holds these paths and nothing else.
only-include = ["LICENSE", "README.md", "conftest.py", "src/moxi_launcher", "tests", "web"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus a tier test whose `touches` glob matches a
# changed path; `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
