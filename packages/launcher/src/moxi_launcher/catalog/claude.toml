# The Claude Code flag catalog. One table per row, keyed by the launcher's name for it;
# moxi_launcher.catalog documents the fields. Modes: interactive (claude) and print
# (claude -p). `moxi doctor` checks the rows against the installed claude --help.

[model]
type = "string"
default = ""
values = ["fable", "opus", "sonnet"]
doc = "The model: an alias, or a model's full name."
group = "model"
label = "Model"
flag = "--model"
modes = ["interactive", "print"]

[effort]
type = "enum"
default = ""
values = ["low", "medium", "high", "xhigh", "max"]
doc = "The effort level."
group = "model"
label = "Effort / reasoning"
flag = "--effort"
modes = ["interactive", "print"]

[agent]
type = "string"
default = ""
doc = "The agent role the session runs as."
group = "seat"
sub = "Role"
label = "Agent role"
flag = "--agent"
modes = ["interactive", "print"]

[tools]
type = "list"
default = []
variadic = true
doc = "The built-in tools the session has, joined with commas."
group = "tools"
sub = "Built-in"
label = "Built-in tool set"
flag = "--tools"
modes = { interactive = { flag = "--tools", join = "," }, print = { flag = "--tools", join = "," } }

[allowed_tools]
type = "list"
default = []
variadic = true
posture = true
doc = "Tools the session may use without asking."
group = "tools"
sub = "Built-in"
label = "Allowed tools"
flag = "--allowedTools"
aliases = ["--allowed-tools"]
modes = ["interactive", "print"]

[disallowed_tools]
type = "list"
default = []
variadic = true
posture = true
doc = "Tools the session may not use."
group = "tools"
sub = "Built-in"
label = "Disallowed tools"
flag = "--disallowedTools"
aliases = ["--disallowed-tools"]
modes = ["interactive", "print"]

[permission_mode]
type = "enum"
default = "default"
values = ["default", "acceptEdits", "auto", "bypassPermissions", "manual", "dontAsk", "plan"]
posture = true
doc = "The permission mode."
group = "access"
sub = "Mode"
label = "Permission mode"
danger = ["bypassPermissions"]
flag = "--permission-mode"
modes = ["interactive", "print"]

[add_dir]
type = "list"
default = []
items = "path"
repeatable = true
variadic = true
doc = "Another directory the session's tools may reach; may be given more than once."
group = "access"
sub = "Reach"
label = "Extra folders"
flag = "--add-dir"
modes = ["interactive", "print"]

[remote_control]
type = "string"
default = false
optional_value = true
doc = "Turn on Remote Control, optionally under a name."
group = "runs-in"
sub = "Remote"
label = "Remote Control"
flag = "--remote-control"
modes = ["interactive"]

[native_name]
type = "string"
default = ""
doc = "The session's display name in Claude Code."
group = "seat"
sub = "Name & notes"
label = "Native name"
flag = "-n"
aliases = ["--name"]
modes = ["interactive", "print"]

[mcp_config]
type = "list"
default = []
variadic = true
doc = "An MCP server config, a JSON file or string; may be given more than once."
group = "tools"
sub = "MCP"
label = "MCP servers for this launch"
flag = "--mcp-config"
modes = ["interactive", "print"]

[session_id]
type = "string"
default = ""
owned = true
doc = "The session id the launcher mints and records before the start."
flag = "--session-id"
modes = ["interactive", "print"]

[append_system_prompt_file]
type = "path"
default = ""
owned = true
hidden = true
doc = "The file holding the identity block and the seat's instructions."
flag = "--append-system-prompt-file"
modes = ["interactive", "print"]

[plugin_dir]
type = "list"
default = []
items = "path"
repeatable = true
owned = true
doc = "A plugin directory the launch additions name."
flag = "--plugin-dir"
modes = ["interactive", "print"]

[resume]
type = "string"
default = ""
owned = true
doc = "The session a resume continues; set only by moxi launcher resume."
flag = "--resume"
aliases = ["-r"]
modes = ["interactive", "print"]

[catalog]
harness = "claude"
checked = "2.1.314"

[catalog.help.claude]
command = ["claude", "--help"]
modes = ["interactive", "print"]
others = [
  "--agents", "--allow-dangerously-skip-permissions", "--append-system-prompt",
  "--autocompact", "--ax-screen-reader", "--background", "--bare", "--betas", "--bg",
  "--brief", "--chrome", "--cloud", "--continue", "--dangerously-skip-permissions",
  "--debug", "--debug-file", "--desktop", "--disable-slash-commands", "--environment",
  "--exclude-dynamic-system-prompt-sections", "--fallback-model", "--file",
  "--fork-session", "--forward-subagent-text", "--from-pr", "--help", "--ide",
  "--include-hook-events", "--include-partial-messages", "--input-format",
  "--json-schema", "--max-budget-usd", "--no-chrome", "--no-session-persistence",
  "--output-format", "--permission-prompts", "--plugin-url", "--print",
  "--prompt-suggestions", "--remote-control-session-name-prefix",
  "--replay-user-messages", "--restricted", "--safe-mode", "--setting-sources",
  "--settings", "--strict-mcp-config", "--system-prompt", "--system-prompt-snapshot",
  "--teleport", "--tmux", "--verbose", "--version", "--worktree", "-c", "-d", "-h", "-p",
  "-v", "-w",
]
