# The launcher's own rows: what a launch sets that no harness spells. One table per row,
# keyed by the launcher's name for it; moxi_launcher.catalog documents the fields.

[harness]
type = "enum"
default = "claude"
values = ["claude", "codex"]
doc = "The harness the launch starts."
fork = "copy"
group = "model"
label = "Harness"

[cwd]
type = "path"
default = ""
doc = "The directory the session starts in; the caller's own when unset."
fork = "copy"
label = "Folder"
carry = false

[project]
type = "string"
default = ""
doc = "A project key, whose directory the session starts in."
fork = "copy"
label = "Project"
carry = false
shown_with = "projects"

[scratch]
type = "bool"
default = false
doc = "Start in a new scratch directory."
fork = "copy"
group = "config"
label = "Scratch folder"
carry = false

[identity]
type = "string"
default = ""
doc = "The comms name the session holds; ignored, with a warning, without comms."
fork = "drop"
group = "seat"
sub = "Comms"
label = "Comms identity"
shown_with = "comms"

[scope]
type = "string"
default = ""
doc = "The comms scope of the identity."
fork = "drop"
group = "seat"
sub = "Comms"
label = "Comms scope"
shown_with = "comms"

[director]
type = "list"
default = []
repeatable = true
requires = "comms"
doc = "A comms identity that directs the session; may be given more than once."
fork = "drop"
group = "seat"
sub = "Comms"
label = "Directors"
shown_with = "comms"

[takes_policy_directors]
type = "bool"
default = true
requires = "comms"
doc = "Whether comms' policy directors direct the session too; false opts it out. Never in [defaults]."
fork = "drop"
group = "seat"
sub = "Comms"
label = "Takes policy directors"
shown_with = "comms"

[instructions]
type = "string"
default = ""
doc = "The seat's standing instructions, inline."
fork = "drop"
group = "seat"
sub = "Instructions"
label = "Standing instructions (inline)"

[instructions_file]
type = "path"
default = ""
doc = "A file holding the seat's standing instructions, read at launch."
fork = "drop"
group = "seat"
sub = "Instructions"
label = "Standing instructions (file)"

[brief]
type = "string"
default = ""
doc = "The brief, sent as the session's first turn."
fork = "drop"
label = "Brief"
carry = false

[brief_file]
type = "path"
default = ""
doc = "A file holding the brief, sent as the session's first turn."
fork = "drop"
label = "Brief from a file"
carry = false

[handoff]
type = "path"
default = ""
doc = "A handoff file, sent as the session's first turn."
fork = "drop"
group = "seat"
label = "Handoff file as first turn"
carry = false

[posture]
type = "string"
default = ""
values = ["operator", "go"]
doc = "The start posture: operator, go, or with:<identity> (with comms)."
fork = "drop"
group = "seat"
sub = "Comms"
label = "Start posture"
typed_with = "comms"

[target]
type = "enum"
default = "terminal"
values = ["terminal", "headless", "slot"]
doc = "Where the session runs: this terminal, headless, or a tmux slot."
fork = "own"
label = "Where it runs"
carry = false

[slot]
type = "string"
default = ""
requires = "slots"
doc = "The tmux slot a slot launch goes into, made again when missing; when unset, the lowest slot with no session running."
fork = "own"
label = "Slot"
carry = false

[extra_flags]
type = "list"
default = []
doc = "Flags passed on to the harness as given, last on its argv."
fork = "copy"
group = "config"
sub = "Pass-through"
label = "Extra harness flags"

[name]
type = "string"
default = ""
doc = "The session's name; the name template's when unset."
fork = "drop"
group = "seat"
sub = "Name & notes"
label = "Session name"
carry = false

[notes_dir]
type = "path"
default = ""
requires = "notes"
doc = "The notes directory the session works in."
fork = "drop"
group = "seat"
sub = "Name & notes"
label = "Notes folder"

[warn_at]
type = "string"
default = "2x"
requires = "usage"
doc = "The context mark at which usage warns the session, and a launch that relaunches itself is told it may: 1x, 1.5x, 2x or off; 2x unless set, none for a seat or Codex launch unless set."
fork = "drop"
group = "lifecycle"
sub = "Context"
label = "Warn at context mark"

[keep_warm]
type = "enum"
default = "off"
values = ["off", "on"]
requires = ["turns", "cache"]
condition = "cache-timer"
doc = "Nudge the session before its prompt cache expires while it waits on work it handed out."
fork = "drop"
group = "lifecycle"
sub = "Cache"
label = "Keep warm"

[recycle_on_expiry]
type = "enum"
default = "off"
values = ["off", "clear", "compact"]
requires = ["turns", "cache"]
condition = "cache-timer"
doc = "Clear the session once idle after its prompt cache has expired, or compact it shortly before, once per idle stretch, while it is idle and its cache still warm."
fork = "drop"
group = "lifecycle"
sub = "Cache"
label = "Recycle on cache expiry"

[recycle_at_limit]
type = "enum"
default = "off"
values = ["off", "relaunch"]
retired_values = { compact = "compact at the context limit is gone; set recycle_at_limit off or relaunch, and recycle_on_expiry = compact to compact before the cache expires" }
requires = ["turns", "usage"]
doc = "Let the session relaunch itself with its handoff once its context passes warn_at; off, the default, leaves it out."
fork = "drop"
group = "lifecycle"
sub = "Context"
label = "Recycle at limit"

[recycle_at_limit.when.relaunch]
requires = ["slots"]
condition = "slots-here"
target = "slot"
refused = "relaunch at limit needs slots and a slot launch"
hint = "launch it in a slot (--target slot) where tmux slots run, or set recycle_at_limit off"

[limit_at]
retired = "the launcher no longer compacts at a context mark; remove limit_at (the relaunch line comes at warn_at)"

[headless_exit]
type = "list"
default = []
repeatable = true
requires = "comms"
doc = "When a headless session with an identity ends: done, cold, idle=<D>, after=<D>; D is like 90m or 2h."
fork = "drop"
group = "lifecycle"
sub = "Headless"
label = "Headless exit"
shown_with = "comms"

[subconscious]
type = "enum"
default = "off"
values = ["off", "automatic", "on-demand"]
requires = ["turns", "memory"]
doc = "memory's subconscious: a second agent that recalls past sessions and notes for the main agent, at each prompt (automatic) or when the agent asks (on-demand). Each recall spends tokens."
fork = "drop"
group = "lifecycle"
sub = "Memory"
label = "Subconscious"
