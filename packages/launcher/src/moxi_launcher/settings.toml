# The launcher's config schema: every key a user may set in CONFIG/launcher/config.toml.
# `moxi config launcher` shows every key; `moxi config set launcher KEY VALUE` sets one.
# Seats and project presets are not here: they live in CONFIG/launcher/presets.toml.

[ready.wait_s]
type = "int"
default = 60
doc = "How long a launch waits for the started session to be ready before its first turn, in seconds."
read = "use"
label = "For a started session to be ready"
group = "Waits"
unit = "seconds"

[first.wait_s]
type = "int"
default = 120
doc = "How long a launch waits for its first turn to start once delivered, in seconds."
read = "use"
label = "For the first turn to start"
group = "Waits"
unit = "seconds"

[startup.wait_s]
type = "int"
default = 20
doc = "How long a slot launch watches for startup screens to answer, in seconds."
read = "use"
needs = "slots"
label = "For startup screens, in a slot"
group = "Waits"
unit = "seconds"

[startup.trust_dialog]
type = "bool"
default = false
doc = "Answer Claude Code's folder-trust screen in a slot launch, when it shows."
read = "use"
needs = "slots"
label = "Answer the folder-trust screen"
line = "In a slot launch, answers Claude Code's “Do you trust this folder?” for you."
common = true
hurts = { when = "on", says = "answers the trust question for every slot launch", confirm = "Every slot launch says yes to Claude Code's folder-trust screen for you, in whatever folder it starts.", stays = true }

[startup.dev_channels_dialog]
type = "bool"
default = false
doc = "Answer Claude Code's development-channels screen in a slot launch, when it shows."
read = "use"
needs = "slots"
label = "Answer the development-channels screen"
line = "In a slot launch, when it shows."
common = true
hurts = { when = "on", says = "answers the development-channels screen for every slot launch", confirm = "Every slot launch accepts Claude Code's development-channels screen for you." }

[runs.keep_days]
type = "int"
default = 30
doc = "How many days a launch's run files (its prompt file and headless log) are kept."
read = "use"
label = "Keep run files for"
line = "A launch's prompt file and headless log."
common = true
unit = "days"

[relaunch.wait_s]
type = "int"
default = 900
doc = "How long a self relaunch waits for its session to be quiet before it gives up, in seconds."
read = "use"
label = "For the session to be quiet"
group = "Relaunch"
unit = "seconds"

[relaunch.person_s]
type = "int"
default = 120
doc = "How recently a person's use of the pane, or a turn no delivery opened, holds an act, in seconds."
read = "use"
label = "Hold off after a person used the pane"
group = "Relaunch"
unit = "seconds"

[relaunch.dialog_s]
type = "int"
default = 60
doc = "How long a relaunch or exit waits at Claude Code's exit dialog, in seconds."
read = "use"
needs = "slots"
label = "At Claude Code's exit dialog"
group = "Relaunch"
unit = "seconds"

[relaunch.name_wait_s]
type = "int"
default = 15
doc = "How long a relaunch waits for the old session's comms name to be let go, in seconds."
read = "use"
needs = "comms"
label = "For the old comms name to be let go"
group = "Relaunch"
unit = "seconds"

[relaunch.follow_s]
type = "int"
default = 300
doc = "How long a director's relaunch call follows its run before it returns, in seconds."
read = "use"
label = "A director's call follows its run for"
group = "Relaunch"
unit = "seconds"

[relaunch.fallback]
type = "string"
default = ""
doc = "A comms identity told of a failed relaunch when the launch has no director to tell, or when the notice to its directors is refused or fails (not while comms is offline)."
read = "use"
needs = "comms"
label = "Tell this agent when a relaunch fails"
line = "A comms name, used when the launch has no director to tell."
common = true

[relaunch.pass_env]
type = "list"
default = []
items = "str"
doc = "Variable names, such as a sign-in token or API key, that a self relaunch, a repair or a resume carries from the environment of the process running it into the new session. A launch never records a credential, so this is how one comes back."
read = "use"
label = "Carry into a relaunch"
line = "Names of environment variables, such as a sign-in token, that a relaunch, a repair or a resume carries into the new session."
common = true
hurts = { when = "add", says = "carries this variable into every relaunch", confirm = "From the next relaunch, repair or resume, its value is carried into the new session." }

[relaunch.director_pass_env]
type = "list"
default = []
items = "str"
doc = "Variable names a director's relaunch carries from the director's environment into the new session; empty, nothing of the director's comes in."
read = "use"
label = "Carry from a director"
line = "Variable names a director's relaunch carries from the director's environment."
group = "Relaunch"

[relaunch.notice_retry_s]
type = "int"
default = 30
doc = "How long a relaunch notice refused for its sender's place is tried again, in seconds."
read = "use"
needs = "comms"
label = "Retry a refused notice for"
group = "Relaunch"
unit = "seconds"

[recycle.limit_wait_s]
type = "int"
default = 1800
doc = "How long a compact at the context limit waits for the session to be idle, in seconds."
read = "use"
label = "For idle, to compact at the limit"
group = "Waits"
unit = "seconds"

[keep_warm.subagent_cap]
type = "int"
default = 3
doc = "How many keep-warm nudges in a row a session waiting on subagents gets."
read = "use"
label = "Nudges in a row, waiting on subagents"
group = "Keep warm"
unit = "nudges"

[keep_warm.director_cap]
type = "int"
default = 10
doc = "How many keep-warm nudges in a row a director gets, for its open holds or for the agents it directs."
read = "use"
label = "Nudges in a row, a director"
group = "Keep warm"
unit = "nudges"

[keep_warm.subagent_texts]
type = "list"
default = ["Keep-warm check: say in one line what each running subagent is doing.", "Keep-warm decision: for each running subagent, stop it, split its work or let it run.", "Last keep-warm nudge: after this the cache goes cold; leave the session ready for that."]
items = "str"
doc = "The keep-warm nudges for a session waiting on subagents, in order; the subagents are named after each."
read = "use"
label = "What the nudges say, waiting on subagents"
group = "Keep warm"

[keep_warm.director_texts]
type = "list"
default = ["Keep-warm: reply warm unless you are mid-work.", "Keep-warm: check each open hold by name, and release those whose work is done."]
items = "str"
doc = "The keep-warm nudges for a director with open holds: the first, then the second for every later one."
read = "use"
label = "What the nudges say, a director"
group = "Keep warm"

[keep_warm.directing_texts]
type = "list"
default = ["Keep-warm: agents you direct are still working. Reply warm unless you are mid-work."]
items = "str"
doc = "The keep-warm nudges for a director under cover with no open hold, in order, the last repeating; the directed agents at work are named after each."
read = "use"
needs = "comms"
label = "What the nudges say, agents still at work"
line = "For a director with no open hold whose agents are still working; the last one repeats."
group = "Keep warm"

[name.template]
type = "string"
default = "<project>-<model>-<date:mmm-dd hh:mm>"
doc = "The template a launch's session name is made from, with the pieces <project>, <agent>, <model>, <identity>, <scope>, <instance>, <date[:format]> and <time[:format]>."
read = "use"

[name.templates]
type = "table"
default = {}
items = "str"
doc = "A name template of its own for a project, by project key; a project with none takes name.template."
read = "use"

[page.launch_wait_s]
type = "int"
default = 600
doc = "How long a launch made from the page may take, and how long a preview stays good for launching, in seconds."
read = "use"
label = "A launch from the page may take"
group = "Waits"
unit = "seconds"

[records.keep_days]
type = "int"
default = 90
doc = "How many days ended runs, their events and exits, and released holds are kept."
read = "use"
label = "Keep run records for"
line = "Ended runs, their events and exits, and released holds."
common = true
unit = "days"
