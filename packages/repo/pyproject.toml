[project]
name = "moxi-repo"
version = "0.1.0"
description = "Git hooks run as declared pieces, and the one shared committer."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
dependencies = ["moxi>=0.1,<0.2"]

[project.urls]
Homepage = "https://github.com/moxihq/moxi"
Repository = "https://github.com/moxihq/moxi"
Issues = "https://github.com/moxihq/moxi/issues"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
repo = "moxi_repo.module"

# repo's own git hook piece, declared the way any module declares one.
[project.entry-points."moxi.repo.git_hooks"]
"repo.commit-rules" = "moxi_repo.commit_rules:COMMIT_RULES"

[dependency-groups]
dev = ["pytest", "moxi-dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_repo"]

[tool.hatch.build.targets.sdist]
# A source distribution holds these paths and nothing else.
only-include = ["LICENSE", "README.md", "conftest.py", "src/moxi_repo", "tests"]

# A plain `pytest` runs the units and contract seams, and so does `moxi-dev check`: the
# tiers are deselected here. Run one by hand with `pytest -m <tier>` (a live test also
# needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
