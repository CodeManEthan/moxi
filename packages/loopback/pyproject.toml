[project]
name = "moxi-loopback"
version = "0.1.0"
description = "The base every Moxi page server is built on: the request check, the route table, the runtime file and the server."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
keywords = ["agents", "harness", "loopback", "asgi", "local-server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries",
]
# All four are required: every page server runs on them, so an extra would enable nothing.
# h11 is named for its floor, 0.16, which fixed a request-smuggling bug; uvicorn alone
# allows older ones.
dependencies = [
    "moxi>=0.1.1,<0.2",
    "starlette>=1.10,<2",
    "uvicorn>=0.54,<1",
    "h11>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/moxihq/moxi"
Repository = "https://github.com/moxihq/moxi"
Issues = "https://github.com/moxihq/moxi/issues"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
loopback = "moxi_loopback.module"

[dependency-groups]
dev = ["pytest", "moxi-dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_loopback"]

[tool.hatch.build.targets.sdist]
# A source distribution holds these paths and nothing else.
only-include = ["LICENSE", "README.md", "conftest.py", "src/moxi_loopback", "tests"]

# A plain `pytest` runs the units and contract seams, and so does `moxi-dev check`: the
# tiers are deselected here. Run one by hand with `pytest -m <tier>` (a live test also
# needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
