[project]
name = "moxi-tunnel"
version = "0.1.0"
description = "An address that something off the box can reach, for a loopback service: Tailscale Serve, Tailscale Funnel or a Cloudflare named tunnel, recording only what it applied."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
# The core with the daemon switch and the uninstall listeners tunnel relies on.
dependencies = ["moxi>=0.1.1,<0.2"]

[project.urls]
Homepage = "https://github.com/CodeManEthan/moxi"
Repository = "https://github.com/CodeManEthan/moxi"
Issues = "https://github.com/CodeManEthan/moxi/issues"

# The Cloudflare daemon's command: runs cloudflared on tunnel's own cloudflared.yml.
[project.scripts]
moxi-tunnel-cloudflared = "moxi_tunnel.cloudflared:main"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
tunnel = "moxi_tunnel.module"

# The core's install listener: called after every module's install settles and before
# every module's uninstall removes its package.
[project.entry-points."moxi.installs"]
tunnel = "moxi_tunnel.installs"

[dependency-groups]
dev = ["pytest", "moxi-dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package directory whole, so settings.toml ships beside the code.
packages = ["src/moxi_tunnel"]

[tool.hatch.build.targets.sdist]
# A source distribution holds these paths and nothing else.
only-include = ["LICENSE", "README.md", "conftest.py", "src/moxi_tunnel", "tests"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus a tier test whose `touches` glob matches a
# changed path; `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1). Mark a test that asserts
# a wall-clock budget `timed`: the check runs it alone, after the parallel pass.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
