[project]
name = "moxi-services"
version = "0.1.0"
description = "Moxi's services: one list of every daemon and timer on the machine, with start, stop, enable, disable, add, remove and watch."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
dependencies = ["moxi>=0.1,<0.2"]

[project.optional-dependencies]
# Project keys on services and projects' remove check. services reaches projects only
# through moxi.modules.load("projects"), and projects reads services' link through its
# `moxi.projects` group below.
projects = ["moxi-projects>=0.1,<0.2"]

[project.urls]
Homepage = "https://github.com/moxihq/moxi"
Repository = "https://github.com/moxihq/moxi"
Issues = "https://github.com/moxihq/moxi/issues"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
services = "moxi_services.module"

# projects asks this before it removes a project: no project goes while a service names it.
[project.entry-points."moxi.projects"]
services = "moxi_services.projects_link"

[dependency-groups]
dev = ["pytest", "moxi-dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_services"]

[tool.hatch.build.targets.sdist]
# A source distribution holds these paths and nothing else.
only-include = ["LICENSE", "README.md", "conftest.py", "src/moxi_services", "tests"]

# A plain `pytest` runs the units and contract seams, and so does `moxi-dev check`: the
# tiers are deselected here. Run one by hand with `pytest -m <tier>` (a live test also
# needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
