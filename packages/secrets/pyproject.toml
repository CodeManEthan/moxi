[project]
name = "moxi-secrets"
version = "0.1.0"
description = "Named pattern sets for credentials, catch-alls, private names and personal data, and one way to scan text for them."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
dependencies = ["moxi>=0.1.6,<0.2"]

[project.optional-dependencies]
# The fast engine. google-re2 ships wheels only for some platforms, and an install that
# finds none builds the sdist, which needs the C++ RE2 and abseil libraries. The marker
# keeps the extra from reaching past the newest CPython a wheel exists for; raise its bound,
# and engine.re2_wheel_fits() with it, when google-re2 ships a wheel for the next one.
re2 = ["google-re2>=1.1; platform_python_implementation == 'CPython' and python_version < '3.15'"]
# The personal-data set's validators.
personal-data = ["python-stdnum>=2.2"]

[project.urls]
Homepage = "https://github.com/CodeManEthan/moxi"
Repository = "https://github.com/CodeManEthan/moxi"
Issues = "https://github.com/CodeManEthan/moxi/issues"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
secrets = "moxi_secrets.module"

[dependency-groups]
dev = [
    "pytest",
    "moxi-dev",
    "google-re2>=1.1; platform_python_implementation == 'CPython' and python_version < '3.15'",
    "python-stdnum>=2.2",
]

# Import names that differ from their distribution's name.
[tool.moxi.imports]
re2 = "google-re2"
stdnum = "python-stdnum"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_secrets"]

[tool.hatch.build.targets.sdist]
# A source distribution holds these paths and nothing else.
only-include = ["LICENSE", "README.md", "conftest.py", "src/moxi_secrets", "tests"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus a tier test whose `touches` glob matches a
# changed path; `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
