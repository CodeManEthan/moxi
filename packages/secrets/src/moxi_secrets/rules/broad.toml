# The broad set: catch-alls that find secrets of no known shape, by context or by how
# random they look, and pay for it in false positives. A caller picks it only where a
# false positive is cheap.
#
# The set also holds every rule credentials.toml disables (today gitleaks'
# generic-api-key), which the generator takes from the pinned upstream file with its
# keywords, entropy floor and allowlists. This file holds only Moxi's own two rules, in
# the syntax both Go's regexp and RE2 accept.

title = "moxi broad"

[[rules]]
id = "credential-assignment"
description = "A quoted value after a key named like a password or secret"
regex = '''(?i)["']?[\w.-]{0,50}(?:password|passwd|secret_key|api_secret)[\w.-]{0,50}["']?\s*[:=]\s*["']([^"'\r\n]{4,})["']'''
keywords = ["password", "passwd", "secret_key", "api_secret"]

# No slash in the alphabet: with an entropy floor of 4.3 that keeps hex digests, UUIDs
# and paths out without a lookahead.
[[rules]]
id = "high-entropy-run"
description = "A long run of letters, digits and + _ - that looks random"
regex = '''(?:^|[^A-Za-z0-9+/_-])([A-Za-z0-9+_-]{40,}={0,2})(?:[^A-Za-z0-9+/=_-]|$)'''
entropy = 4.3
