# The credentials set: gitleaks' pinned default rules, less its generic rule, plus Moxi's
# own rules below. This is a gitleaks config file: the gitleaks binary runs it from this
# directory (it resolves [extend] path against its working directory), and _generate.py
# resolves it into sets.json for the in-process scanner.
#
# Every pattern here uses only syntax that both Go's regexp and RE2 accept, so the binary
# and the in-process scanner run the same file. Each local rule's id is one no upstream
# rule uses; the generator refuses a clash. A rule disabled here goes to the broad set.

title = "moxi credentials"

[extend]
path = "upstream/gitleaks.toml"
disabledRules = ["generic-api-key"]

# sets.json holds every pattern, so it matches as a credential itself. It is generated
# from this directory's files and the regeneration test refuses anything else in it.
[[allowlists]]
description = "the package's own generated rule file"
paths = ['''(?:^|/)moxi_secrets/rules/sets\.json$''']

[[rules]]
id = "bws-access-token"
description = "Bitwarden Secrets Manager access token"
regex = '''\b0\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.[A-Za-z0-9]{20,}(?::[A-Za-z0-9+/]{20,}={0,2})?'''
keywords = ["0."]

[[rules]]
id = "google-oauth-access-token"
description = "Google OAuth access token"
regex = '''\bya29\.[A-Za-z0-9_-]{20,}'''
keywords = ["ya29."]

[[rules]]
id = "google-oauth-refresh-token"
description = "Google OAuth refresh token"
regex = '''\b1//0[A-Za-z0-9_-]{30,}'''
keywords = ["1//0"]

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''\bGOCSPX-[A-Za-z0-9_-]{28}'''
keywords = ["gocspx-"]

# Three short dotted segments, so no keyword: the id part is the base64 of a snowflake.
[[rules]]
id = "discord-bot-token"
description = "Discord bot token, bare"
regex = '''\b[MNO][A-Za-z0-9_-]{22,25}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,38}\b'''
entropy = 3.5

# No word boundary on the left: in the API URL the bot id is glued to the word "bot".
[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token, bare or inside an API URL"
regex = '''(?:^|[^0-9])([0-9]{8,10}:AA[A-Za-z0-9_-]{30,37})\b'''
keywords = [":aa"]

# The user part may be empty, as in a Redis URL. Quotes end a segment, so a URL inside JSON
# stops cleanly.
[[rules]]
id = "url-credential"
description = "Password inside a URL's user part"
regex = '''\b[a-z][a-z0-9+.-]{1,20}://[^:/@\s"']{0,60}:([^@\s"']{3,})@'''
keywords = ["://"]

[[rules.allowlists]]
description = "placeholder passwords"
stopwords = ["password", "pass", "changeme", "xxx", "${"]

# The header line alone: the upstream private-key rule needs the whole block.
[[rules]]
id = "private-key-header"
description = "A private key's header line, without the block"
regex = '''-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----'''
keywords = ["-----begin"]

[[rules]]
id = "ntfy-access-token"
description = "ntfy access token"
regex = '''\btk_[a-z0-9]{29}\b'''
keywords = ["tk_"]

# The header as written in curl, HTTP and JSON; the secret is the token after the scheme.
[[rules]]
id = "authorization-bearer"
description = "Bearer token in an Authorization header"
regex = '''(?i)\bauthorization["']?\s*[:=]\s*["']?bearer\s+([A-Za-z0-9._~+/-]{20,}=*)'''
keywords = ["bearer"]
entropy = 3.5
