# The secrets module's config schema. The file it governs is CONFIG/secrets/config.toml;
# `moxi config secrets` shows every key and `moxi config secrets init` writes the file.
# Every key is read at its use, so an edit takes effect at the next scan.

[private_names.words]
type = "list"
items = "str"
default = []
doc = "Names that identify you: your names, logins, agent names, private package and organisation names. Plain text, any case. A word hits unless a letter or digit stands right next to it; - and _ match each other."
read = "use"

[private_names.anywhere]
type = "list"
items = "str"
default = []
doc = "Names that identify you even when glued to other text, such as a private organisation name used as a prefix. Matched anywhere, any case."
read = "use"

[private_names.emails]
type = "list"
items = "str"
default = []
doc = "Email addresses that identify you; matched anywhere in any case."
read = "use"

[private_names.allowed]
type = "list"
items = "str"
default = []
doc = "Text that contains a private name but is public on purpose, such as a public handle or contact address. Never a hit."
read = "use"

[author.name]
type = "string"
default = ""
doc = "The name your public commits are authored as. Publishing reads it; never a hit."
read = "use"

[author.email]
type = "string"
default = ""
doc = "The email your public commits are authored as. Publishing reads it; never a hit."
read = "use"
