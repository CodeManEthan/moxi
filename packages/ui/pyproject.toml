[project]
name = "moxi-ui"
version = "0.1.0"
description = "The browser shell: one origin for every module's page"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
dependencies = ["moxi>=0.1.1,<0.2", "moxi-loopback>=0.1,<0.2", "psutil>=5.9", "h11>=0.16,<1"]

# Only the core declares the `moxi` script; this is the shell's own entry point, the
# command its unit runs.
[project.scripts]
moxi-ui-serve = "moxi_ui.serve:main"

# The browser half of `moxi_ui.testing`, the pytest plugin a module's own tests use; the
# plugin loads without it, and only its fixtures need it.
[project.optional-dependencies]
testing = ["pytest>=8", "playwright>=1.56,<2"]

[project.urls]
Homepage = "https://github.com/moxihq/moxi"
Repository = "https://github.com/moxihq/moxi"
Issues = "https://github.com/moxihq/moxi/issues"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
ui = "moxi_ui.module"

# `moxi_ui.testing`, loaded in every pytest run where moxi-ui is installed; loading it
# imports only the standard library and pytest.
[project.entry-points.pytest11]
moxi_ui = "moxi_ui.testing"

[dependency-groups]
dev = ["pytest", "moxi-dev", "moxi-ui[testing]"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_ui"]

[tool.hatch.build.targets.sdist]
# A source distribution holds these paths and nothing else.
only-include = ["LICENSE", "README.md", "conftest.py", "src/moxi_ui", "tests", "web"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus the browser tests when Playwright's Chromium
# starts there, plus a tier test whose `touches` glob matches a changed path;
# `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
