[project]
name = "moxi-ui"
version = "0.2.2"
description = "The browser shell: one origin for every module's page"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
keywords = ["browser", "ui", "agents", "passkeys", "localhost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
# The server libraries are required: every page server runs on them, so an extra would
# enable nothing. h11 is named for its floor, 0.16, which fixed a request-smuggling bug;
# uvicorn alone allows older ones.
dependencies = ["moxi>=0.1.6,<0.2", "starlette>=1.10,<2", "uvicorn>=0.54,<1", "h11>=0.16,<1",
                "psutil>=5.9"]

# Only the core declares the `moxi` script; this is the shell's own entry point, the
# command its unit runs.
[project.scripts]
moxi-ui-serve = "moxi_ui.serve:main"

# The browser half of `moxi_ui.testing`, the pytest plugin a module's own tests use; the
# plugin loads without it, and only its fixtures need it; `cryptography` makes the phone
# bridge's certificates. On Windows a gateway-mode test shell keeps its files out of the
# real profile through platformdirs' `WIN_PD_OVERRIDE_*` variables, which older releases
# don't read.
[project.optional-dependencies]
testing = ["pytest>=8", "playwright>=1.56,<2", "cryptography>=46",
           "platformdirs>=4.11.3; sys_platform == 'win32'"]
# The gateway, the UI on a phone: passkeys need `webauthn`, which a shell user without a
# phone shouldn't install.
gateway = ["webauthn>=2.5,<3"]
# The tunnel gives the gateway its address; 0.2 is the first that offers interface 2.
tunnel = ["moxi-tunnel>=0.2,<0.3"]

[project.urls]
Homepage = "https://github.com/CodeManEthan/moxi"
Repository = "https://github.com/CodeManEthan/moxi"
Issues = "https://github.com/CodeManEthan/moxi/issues"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
ui = "moxi_ui.module"

# The gateway's tunnel target, in the group only a tunnel that asks `upstream()` reads.
[project.entry-points."moxi.tunnel.targets"]
"ui.gateway" = "moxi_ui.tunnel:GATEWAY"

# Told when a tunnel address changes: marks devices stale, keeps the copy of retired origins.
[project.entry-points."moxi.tunnel.changes"]
ui = "moxi_ui.tunnel:on_change"

# `moxi_ui.testing`, loaded in every pytest run where moxi-ui is installed; loading it
# imports only the standard library and pytest.
[project.entry-points.pytest11]
moxi_ui = "moxi_ui.testing"

[dependency-groups]
dev = ["pytest", "moxi-dev", "moxi-ui[testing,gateway]", "cryptography>=46"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_ui"]

[tool.hatch.build.targets.sdist]
# A source distribution holds these paths and nothing else.
only-include = ["CHANGELOG.md", "LICENSE", "README.md", "conftest.py", "docs",
                "src/moxi_ui", "tests", "web"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus the browser tests when Playwright's Chromium
# starts there, plus a tier test whose `touches` glob matches a changed path;
# `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
