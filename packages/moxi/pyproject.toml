[project]
name = "moxi"
version = "0.1.1"
description = "Moxi's core: the names, paths, config and module discovery every Moxi module shares, and the moxi command"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
keywords = ["agents", "harness", "claude-code", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
# The core declares no extras. psutil reads a process's start time and platformdirs finds
# the Windows folders, each imported only inside the function that needs it.
dependencies = ["psutil>=5.9", "platformdirs>=4; sys_platform == 'win32'"]

# Only the core declares this script, and no other: `uv tool install moxi` puts the
# umbrella on PATH, and `moxi install <module>` adds modules beside it.
[project.scripts]
moxi = "moxi.cli:main"

[project.urls]
Homepage = "https://github.com/moxihq/moxi"
Repository = "https://github.com/moxihq/moxi"
Issues = "https://github.com/moxihq/moxi/issues"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi"]

[tool.hatch.build.targets.sdist]
# A source distribution built from any branch holds these paths and nothing else.
only-include = ["LICENSE", "README.md", "src/moxi", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
