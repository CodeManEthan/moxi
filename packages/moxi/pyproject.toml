[project]
name = "moxi"
version = "0.1.4"
description = "Moxi's core: the names, paths, config and module discovery every Moxi module shares, and the moxi command"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
keywords = ["agents", "harness", "claude-code", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
# The core declares no extras. psutil reads a process's start time, imported only inside
# the function that needs it. The Windows folders come from the shell through ctypes.
dependencies = ["psutil>=5.9"]

# Only the core declares this script, and no other: `uv tool install moxi` puts the
# umbrella on PATH, and `moxi install <module>` adds modules beside it.
[project.scripts]
moxi = "moxi.cli:main"

[project.urls]
Homepage = "https://github.com/CodeManEthan/moxi"
Repository = "https://github.com/CodeManEthan/moxi"
Issues = "https://github.com/CodeManEthan/moxi/issues"

[dependency-groups]
dev = ["pytest", "moxi-dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi"]

[tool.hatch.build.targets.sdist]
# A source distribution built from any branch holds these paths and nothing else.
only-include = ["LICENSE", "README.md", "conftest.py", "src/moxi", "tests", "tools"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus a tier test whose `touches` glob matches a
# changed path; `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
