# turns' config schema: every key a user may set in CONFIG/turns/config.toml.
# The endpoint reads this file through moxi.config; the Claude runner reads no key.

# Guards: checks that run before a tool call and may refuse it. A guard runs only when its
# id or its file is on guards.run, or its module's switch for it reads true. turns' own
# three guards each have a switch here, asked once at install, all off by default.

[guards.removal]
type = "bool"
default = false
doc = "Run the removal guard: refuse a shell command with a cd, an rm and a *, which Claude Code would stop for approval."
read = "use"
label = "Removal guard"
line = "Refuses shell removals that Claude Code would stop for approval."
common = true
group = "Guards"
hurts = { when = "off", says = "turns this guard off", confirm = "From its next tool call, an agent in any session can run a shell removal with a cd, an rm and a * without this guard stopping it." }

[guards.no_nested_agents]
type = "bool"
default = false
doc = "Run the no-nested-agents guard: stop subagents from starting subagents of their own."
read = "use"
label = "No nested agents"
line = "Stops subagents from starting subagents of their own."
common = true
group = "Guards"
hurts = { when = "off", says = "turns this guard off", confirm = "From its next tool call, a subagent in any session can start subagents of its own." }

[guards.question_mode]
type = "bool"
default = false
doc = "Run question mode: let agents ask questions only in a turn where the person typed something about a question."
read = "use"
label = "Question mode"
line = "Agents may ask questions only in a turn where you typed something about a question."
common = true
group = "Guards"
hurts = { when = "off", says = "turns this guard off", confirm = "From its next tool call, an agent in any session can ask questions in any turn." }

[guards.run]
type = "list"
items = "str"
default = []
doc = "The guards that run: guard ids (turns.removal, usage.ceiling) and paths to custom guard files."
read = "use"
label = "Other guards that run"
line = "Guard names, and paths to guard files of your own."
common = true
group = "Guards"
hurts = { when = "remove", says = "stops this guard", confirm = "From the next tool call, this guard no longer runs in any session, unless its own switch is on." }

[guards.max_wait_ms]
type = "int"
default = 3000
doc = "The most any guard's judge may take on one tool call, in milliseconds; a guard's own deadline is clamped to it."
read = "use"
label = "The most a guard may take"
group = "Waits"
unit = "ms"

[stop_handler.wait_ms]
type = "int"
default = 2000
doc = "How long a Stop waits for the session's stop handler to answer before the turn ends, in milliseconds."
read = "start"
label = "For a session's stop handler"
group = "Waits"
unit = "ms"

[listen.wait_ms]
type = "int"
default = 2000
doc = "How long an event waits for the registered listeners to answer, in milliseconds."
read = "start"
label = "For listeners on an event"
group = "Waits"
unit = "ms"

[after_tool.wait_ms]
type = "int"
default = 300
doc = "How long the after-tool listeners may take on one tool call, together, in milliseconds."
read = "use"
label = "The most after-tool listeners may take"
group = "Waits"
unit = "ms"

# The start list: what adds context when a session starts, resumes, is cleared or is
# compacted, in this order. An entry is a module name or a file path (one holding a `/`
# or starting with `~`). A module not installed is skipped; a module not on the list adds
# no start context. Setting the key replaces the whole list.
[start.order]
type = "list"
items = "str"
default = ["launcher", "comms", "notes", "memory"]
doc = "What adds start context, in order: module names, file paths and run entries (run:<path>, a program whose output is added); setting it replaces the whole list."
read = "start"
label = "Start context, in order"
line = "What adds context when a session starts, resumes, is cleared or is compacted."
common = true
group = "Sessions"

[commands.allow]
type = "list"
items = "str"
default = []
doc = "Session commands (clear, exit, compact) every session may be asked to run; a launch may add more for itself."
read = "use"
label = "Commands any session may be asked to run"
line = "clear, exit or compact. A launch may add more for itself."
common = true
group = "Sessions"

[start.limit_chars]
type = "int"
default = 0
doc = "The most start context a session gets, in characters; 0 (or a value past the harness's ceiling) means the ceiling."
read = "start"
label = "Start context limit"
line = "0, or more than the harness allows, means the harness's own ceiling."
unit = "characters"

[claude.endpoint]
type = "path"
default = ""
doc = "The endpoint command the Claude plugin spawns; empty means this environment's moxi-turns-endpoint."
read = "use"
label = "The endpoint"
line = "The command the Claude plugin spawns. Empty, it is this environment's moxi-turns-endpoint."

[prompt.own_origins]
type = "list"
items = "str"
default = ["composer", "bridge"]
doc = "The prompt origins that count as the person's own, which question mode and every prompt listener read (composer is a prompt typed at this terminal, bridge one sent from the Claude apps through Remote Control)."
read = "use"
label = "Prompts that count as yours"
line = "composer is a prompt typed at this terminal, bridge one sent from the Claude apps through Remote Control."

[question_mode.prose_words]
type = "list"
items = "str"
default = ["prose", "pros"]
doc = "Words that ask for prose: a prompt holding one gets no question-mode reminder."
read = "use"
label = "Words that ask for prose"
line = "A prompt holding one gets no question-mode reminder."

# Keys an earlier turns read, kept declared so a file that still sets one is told what to
# do rather than refused as unknown.

[hold.wait_ms]
retired = "set stop_handler.wait_ms instead: the hold is now the stop handler"

[start.limit]
retired = "renamed: set start.limit_chars instead"

[guards.on]
retired = "renamed: set guards.run instead"

[question_mode.origins]
retired = "renamed: set prompt.own_origins instead"
