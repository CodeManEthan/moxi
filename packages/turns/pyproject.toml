[project]
name = "moxi-turns"
version = "0.2.0"
description = "Drive a coding-agent session's turns: start, hold, steer and read a turn on any harness."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
dependencies = ["moxi>=0.1,<0.2", "psutil>=5.9"]

[project.optional-dependencies]
codex = ["websockets>=17.0.1"]

[project.urls]
Homepage = "https://github.com/CodeManEthan/moxi"
Repository = "https://github.com/CodeManEthan/moxi"
Issues = "https://github.com/CodeManEthan/moxi/issues"

# Only the core declares the `moxi` script.
[project.scripts]
# Internal entry points, spawned by the Claude runner or a Codex host, never typed.
moxi-turns-endpoint = "moxi_turns.claude_endpoint:main"
moxi-turns-ping = "moxi_turns.codex_hooks:main"
moxi-turns-codex-host = "moxi_turns.codex_host:main"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
turns = "moxi_turns.module"

# turns' shipped guards, and question mode's prompt reminder.
[project.entry-points."moxi.turns.guards"]
turns = "moxi_turns.guards"

[project.entry-points."moxi.turns.listeners"]
turns = "moxi_turns.guards"

[dependency-groups]
dev = ["pytest", "moxi-dev", "websockets>=17.0.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_turns"]
# The Claude plugins' own tests run under `claude plugin test` from the checkout.
exclude = ["src/moxi_turns/claude/*/tests"]

[tool.hatch.build.targets.sdist]
# A source distribution built from any branch holds the published paths and nothing else.
only-include = ["contracts/socket-protocol.md", "src/moxi_turns", "tests", "LICENSE", "README.md",
                "conftest.py"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus a tier test whose `touches` glob matches a
# changed path; `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
