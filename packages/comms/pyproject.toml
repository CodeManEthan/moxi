[project]
name = "moxi-comms"
version = "0.3.0"
description = "Messages between coding-agent sessions, delivered into their turns."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
keywords = ["claude-code", "codex", "opencode", "agents", "messaging", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
]
# turns is required: it is the one way into a harness session (a Claude session's
# delivery, its Stop hold and its context all go through it).
# keyring is the credential chain's keychain step (the macOS Keychain, Windows Credential
# Manager, the Secret Service): required, since Windows is a target and has no other.
# mcp is the SDK comms' tools are served with, from the daemon alone, and uvicorn the
# HTTP server the daemon starts it on: required, since the tools are how a session's
# model sends; `[mcp] enabled = false` turns them off.
dependencies = ["moxi>=0.1.6,<0.2", "moxi-turns>=0.2,<0.3", "keyring>=25", "psutil>=5.9",
                "mcp>=2.3,<3", "uvicorn>=0.54,<1"]

[project.optional-dependencies]
# `moxi-comms-codex` launches each Codex session through turns' Codex host, whose
# app-server link needs `websockets`: turns' own `codex` extra, which this one installs.
codex = ["moxi-turns[codex]>=0.2,<0.3"]
# The cold-send hold reads each agent's prompt cache through the cache module, an
# optional Moxi module comms reaches only through moxi.modules.load("cache").
cache = ["moxi-cache>=0.1,<0.2"]
# The browser UI shell: with it, comms' panel and its roster of agents show there.
ui = ["moxi-ui>=0.2,<0.3"]
# The public MCP host: with it, comms' four tools reach the Claude apps through the host,
# as its provider `moxi_comms.connector`, which only the host loads.
connector = ["moxi-connector>=0.1,<0.2"]
# The services module: with it, a doctor fix that restarts comms' daemon names services'
# restart verb. comms reaches it only through moxi.modules.load("services").
services = ["moxi-services>=0.1,<0.2"]

[project.urls]
Homepage = "https://github.com/CodeManEthan/moxi"
Repository = "https://github.com/CodeManEthan/moxi"
Issues = "https://github.com/CodeManEthan/moxi/issues"

# Only the core declares the `moxi` script. The module's own commands run as
# `moxi comms <verb>`; there is no bare `comms` script. The internal entry points below
# are each named moxi-comms-<part>.
[project.scripts]
moxi-comms-daemon = "moxi_comms.daemon:main"
moxi-comms-shim = "moxi_comms.adapters.claude_shim:main"
moxi-comms-claude = "moxi_comms.adapters.session:main"
moxi-comms-codex = "moxi_comms.adapters.codex:main"
moxi-comms-opencode = "moxi_comms.adapters.opencode:main"
moxi-comms-provision = "moxi_comms.provision:main"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
comms = "moxi_comms.module"

# comms reserves the send-only names each module declares when it installs, and frees
# them when it is uninstalled.
[project.entry-points."moxi.installs"]
comms = "moxi_comms.reserved"

# comms' listener: turns asks it at a session's start and at each prompt for the context
# comms adds (layer one, the roster and its deltas).
[project.entry-points."moxi.turns.listeners"]
comms = "moxi_comms.listeners"

# comms' MCP server in a launch: turns asks it what a launch adds, and it answers the
# server only when comms' wrapper stamped the session's token and the server's URL.
[project.entry-points."moxi.turns.additions"]
comms = "moxi_comms.mcp.additions:additions"

# The adapter kinds a binding may register as. comms declares its own here, as any module
# declares one (see moxi_comms/kinds.py).
[project.entry-points."moxi.comms.kinds"]
claude-shim = "moxi_comms.kinds:CLAUDE_SHIM"
codex = "moxi_comms.kinds:CODEX"
opencode = "moxi_comms.kinds:OPENCODE"
connector = "moxi_comms.kinds:CONNECTOR"

# comms' tools in the Claude apps: the public MCP host loads this provider, and nothing in
# comms imports it.
[project.entry-points."moxi.connector.providers"]
comms = "moxi_comms.connector:PROVIDER"

[dependency-groups]
# The suite runs the Codex adapter over turns' real Codex host against a stub app-server,
# and exercises the cache seam, so the dev environment carries `websockets` (the one
# dependency of turns' `codex` extra) and `moxi-cache` beside pytest. moxi-ui's pytest
# plugin runs comms' pages in a real shell, and its testing extra brings the browser; the
# browser tests import Playwright themselves, so it is named too. moxi-dev brings
# pytest-xdist. The endpoint's tests drive it with the MCP SDK's own client, over httpx2.
dev = ["pytest", "websockets>=17.0.1", "moxi-cache>=0.1,<0.2", "moxi-dev",
       "moxi-ui[testing]", "playwright>=1.56,<2", "httpx2>=2.16,<3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package directory whole, so settings.toml (the config schema) ships in the wheel.
packages = ["src/moxi_comms"]

[tool.hatch.build.targets.sdist]
# Only the published paths go into a source distribution, whatever branch it is built
# from (hatchling adds pyproject.toml and .gitignore itself).
only-include = ["CHANGELOG.md", "CONTRIBUTING.md", "LICENSE", "README.md", "conftest.py",
                "docs", "scripts", "src/moxi_comms", "tests", "web"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus the browser tests when Playwright's Chromium
# starts there, plus a tier test whose `touches` glob matches a changed path;
# `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
