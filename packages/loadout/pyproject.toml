[project]
name = "moxi-loadout"
version = "0.1.4"
description = "Your own skills, agents and settings, placed for each harness: Claude Code, Codex and OpenCode."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
keywords = ["claude-code", "codex", "opencode", "skills", "agents", "dotfiles"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = ["moxi>=0.1.6,<0.2", "pyyaml>=6.0,<7"]

[project.optional-dependencies]
# Project sections named by key: loadout resolves a key to its root through projects'
# API, reached only through moxi.modules.load("projects") at the point of use.
projects = ["moxi-projects>=0.1,<0.2"]
# A commit or a merge that changes the loadout folder reinstalls it: loadout registers
# its two git hook pieces with repo, reached only through moxi.modules.load("repo").
repo = ["moxi-repo>=0.1,<0.2"]
# The browser UI shell: with it, loadout's page shows there.
ui = ["moxi-ui>=0.2.3,<0.3"]

[project.urls]
Homepage = "https://github.com/CodeManEthan/moxi"
Repository = "https://github.com/CodeManEthan/moxi"
Issues = "https://github.com/CodeManEthan/moxi/issues"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
loadout = "moxi_loadout.module"

# loadout's install listener: a module's install hands its own skill placements to
# loadout and removes the ones the manifest disables; its uninstall removes the ones
# loadout holds.
[project.entry-points."moxi.installs"]
loadout = "moxi_loadout.listener"

# The two git hook pieces repo's runner calls: a commit or a merge that changes the
# loadout folder runs moxi loadout install.
[project.entry-points."moxi.repo.git_hooks"]
"loadout.reinstall-commit" = "moxi_loadout.gitpiece:REINSTALL_COMMIT"
"loadout.reinstall-merge" = "moxi_loadout.gitpiece:REINSTALL_MERGE"

[dependency-groups]
# moxi-ui's pytest plugin runs loadout's page in a real shell; its testing extra brings
# the browser. The browser tests import Playwright themselves, so it is named too.
dev = ["pytest", "moxi-dev", "moxi-ui[testing]", "playwright>=1.56,<2"]

# Import names that differ from their distribution's name.
[tool.moxi.imports]
yaml = "pyyaml"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_loadout"]

[tool.hatch.build.targets.sdist]
# A source distribution holds these paths and nothing else.
only-include = ["CHANGELOG.md", "LICENSE", "README.md", "conftest.py",
                "src/moxi_loadout", "tests", "web"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus a tier test whose `touches` glob matches a
# changed path; `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1). Mark a test that asserts
# a wall-clock budget `timed`: the check runs it alone, after the parallel pass.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
