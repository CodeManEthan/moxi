[project]
name = "moxi-sessions"
version = "0.2.5"
description = "Read each harness's own session records in one shape: find a session and its subagents, list a root's sources, read records forward or back."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
dependencies = ["moxi>=0.1.6,<0.2"]

[project.optional-dependencies]
# The browser UI shell: with it, the sessions page and its window block show there.
ui = ["moxi-ui>=0.2,<0.3"]
# Redaction for `moxi sessions read`, through secrets' credentials and broad sets.
secrets = ["moxi-secrets>=0.1,<0.2"]
# turns enforces the transcript-read guard sessions declares.
turns = ["moxi-turns>=0.2,<0.3"]

[project.urls]
Homepage = "https://github.com/CodeManEthan/moxi"
Repository = "https://github.com/CodeManEthan/moxi"
Issues = "https://github.com/CodeManEthan/moxi/issues"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
sessions = "moxi_sessions.module"

# sessions' guard for turns: the transcript-read guard.
[project.entry-points."moxi.turns.guards"]
sessions = "moxi_sessions.guards"

[dependency-groups]
# moxi-ui's pytest plugin runs sessions' page in a real shell; its testing extra brings
# the browser. The browser tests import Playwright themselves, so it is named too.
dev = ["pytest", "moxi-dev", "moxi-ui[testing]", "playwright>=1.56,<2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_sessions"]

[tool.hatch.build.targets.sdist]
# A source distribution built from any branch holds only these paths; hatchling adds
# pyproject.toml and .gitignore itself.
only-include = ["CHANGELOG.md", "LICENSE", "README.md", "conftest.py",
                "src/moxi_sessions", "tests", "web"]

# A plain `pytest` runs the units and contract seams: the tiers are deselected here.
# `moxi-dev check` runs the same, plus a tier test whose `touches` glob matches a
# changed path; `moxi-dev check --full` runs every tier but live. Run one by hand with
# `pytest -m <tier>` (a live test also needs MOXI_TEST_LIVE=1).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
