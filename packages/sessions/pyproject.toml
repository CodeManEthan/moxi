[project]
name = "moxi-sessions"
version = "0.2.0"
description = "Read each harness's own session records in one shape: find a session and its subagents, list a root's sources, read records forward or back."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
dependencies = ["moxi>=0.1,<0.2"]

[project.urls]
Homepage = "https://github.com/moxihq/moxi"
Repository = "https://github.com/moxihq/moxi"
Issues = "https://github.com/moxihq/sessions/issues"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
sessions = "moxi_sessions.module"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_sessions"]

[tool.hatch.build.targets.sdist]
# A source distribution built from any branch holds only these paths; hatchling adds
# pyproject.toml and .gitignore itself.
only-include = ["LICENSE", "README.md", "conftest.py", "src/moxi_sessions", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
