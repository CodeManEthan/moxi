# The sessions module's config schema. The file it governs is CONFIG/sessions/config.toml;
# `moxi config sessions` shows every key and `moxi config sessions init` writes the file.

[claude.projects]
type = "path"
default = ""
doc = "Where Claude Code transcripts are read for a session that stated no root of its own; unset, it is ${CLAUDE_CONFIG_DIR:-~/.claude}/projects in the reading process's environment."
read = "use"

[codex.sessions]
type = "path"
default = ""
doc = "Where Codex rollouts are read when no root is handed in; unset, it is ${CODEX_HOME:-~/.codex}/sessions in the reading process's environment."
read = "use"

[opencode.database]
type = "path"
default = ""
doc = "The OpenCode database read when no database is handed in; unset, it is ${XDG_DATA_HOME:-~/.local/share}/opencode/opencode.db in the reading process's environment."
read = "use"

[guard.transcript_read]
type = "bool"
default = false
doc = "Run the transcript-read guard, which turns enforces: an agent's Read, Grep or Glob of a path under a harness's transcript root, or a shell command naming one, is refused and pointed to moxi sessions read. Naming sessions.transcript-read on turns' guards.on runs it too."
read = "use"
