# The usage module's config schema. The file it governs is CONFIG/usage/config.toml;
# `moxi config usage` shows every key and `moxi config usage init` writes the file.

[claude.archive_roots]
type = "list"
default = []
doc = "More Claude Code trees to index besides the live one, each a [[claude.archive_roots]] row with path (a directory holding a projects/ tree, such as a backup of an older machine's ~/.claude) and id (letters, digits, _ or -, unique; its lane is archive:<id>), in the order they rank."
read = "use"
label = "More Claude Code folders to read"
line = "Such as a backup of an older computer's ~/.claude."
common = true

[model]  # noqa: MX4 -- the table of model rows; memory's subconscious.chat.model is the one model a chat recall runs on
type = "list"
default = []
doc = "Your own [[model]] rows over the shipped model table: id, match (exact or prefix), any of input, output, cache_read, cache_write_5m, cache_write_1h (dollars per million tokens), window, max_output, tiers, provider, from and to (a price period, matched on the request's own time) and note. A row that gives any price or tier replaces every price and tier the table has for that model, so it must give input and output too."
read = "use"
label = "Your own model prices"
line = "Rows over the shipped table. A row that gives a price replaces every price for that model."
group = "Prices"

[prices.url]
type = "string"
default = "https://raw.githubusercontent.com/BerriAI/litellm/main/model_prices_and_context_window.json"
doc = "Where `moxi usage prices update` fetches LiteLLM's model price file from."
read = "use"
label = "Where the price file comes from"
group = "Prices"

[prices.max_age_days]
type = "int"
default = 120
doc = "The doctor warns when the model table in effect is older than this many days."
read = "use"
label = "Warn when the price table is older than"
common = true
unit = "days"

[index.workers]
type = "int"
default = 0
doc = "Processes a full rebuild of the token index reads sources with; 0 picks one per core."
read = "use"
label = "Processes for a full rebuild"
line = "0 picks one per core."
group = "Reading"

[index.wait_s]  # noqa: MX4 -- a pass may wait part of a second; launcher's waits are whole seconds
type = "float"
default = 30.0
doc = "Seconds a pass waits for another pass to finish before it exits 75."
read = "use"
label = "Wait for another pass to finish"
group = "Reading"
unit = "seconds"

[limits.codex_pull_after_s]
type = "int"
default = 600
doc = "Seconds after which the newest Codex limits reading counts as stale, so limits asks the Codex app-server for a new one (needs turns); 0 or more."
read = "use"
label = "Ask Codex again after"
group = "Limits"
unit = "seconds"

[limits.history_days]
type = "int"
default = 8
doc = "Days of limits readings kept; 1 or more, since the readings cannot be rebuilt."
read = "use"
label = "Keep limit readings for"
line = "They cannot be rebuilt."
group = "Limits"
unit = "days"

[limits.projection_minutes]
type = "int"
default = 60
doc = "Minutes of readings a window's burn-rate projection fits; 1 or more."
read = "use"
label = "Project a limit from the last"
group = "Limits"
unit = "minutes"

[marks.default]
retired = "remove it: a session is warned only at the mark its launch stamps; set warn_at on the launch, its preset or the launcher's [defaults]"

[marks.max_age_days]
type = "int"
default = 7
doc = "Days a fired mark's record is kept after its session was last seen; 1 or more."
read = "use"
label = "Keep a fired mark for"
group = "Marks"
unit = "days"

[marks.handler_wait_ms]
type = "int"
default = 200
doc = "Milliseconds usage waits for a crossing handler's line before it answers without it."
read = "use"
label = "Wait for a mark's handler"
group = "Marks"
unit = "ms"

[stop.deny_text]
type = "string"
default = "This session is past its stop mark ({mark}). Only wrap-up works now: commit your work with git, write your handoff in {folder}, send what you owe on comms, then run moxi launcher relaunch --self --handoff FILE."
doc = "The line given when a session passes the stop mark its launch set (the launcher's stop_at), and the reason for each tool call refused after it; {mark} and {folder} (the launch's handoff folder) are filled in."
read = "use"
label = "The stop's words"
group = "Marks"

[restart_point.days]
type = "int"
default = 21
doc = "Days of indexed sessions the restart-point measure reads; 1 or more."
read = "use"
label = "Measure from the last"
group = "Restart point"
unit = "days"

[restart_point.interactive_only]
type = "bool"
default = true
doc = "Measure the restart point from sessions a person ran at the keyboard only."
read = "use"
label = "Only sessions a person ran"
group = "Restart point"

[restart_point.interactive_originators]
type = "list"
items = "str"
default = ["codex-tui", "Codex Desktop"]
doc = "Codex originators that count as a person at the keyboard, besides a cli source."
read = "use"
label = "Codex programs that count as a person"
group = "Restart point"

[restart_point.measure_weekly]
type = "bool"
default = false
doc = "Measure the restart point once a week on a timer."
read = "use"
label = "Measure the restart point each week"
common = true

[ceiling.enabled]
type = "bool"
default = false
doc = "Run the worker ceiling, the guard that warns a subagent and then refuses its tools once its context has grown past warn_tokens and hard_tokens; naming usage.ceiling on turns' guards.run runs it too."
read = "use"
label = "Worker ceiling"
line = "Warns a subagent, then refuses its tools, once its context has grown past the two numbers below. It acts only when both are above 0."
common = true
hurts = { when = "off", says = "turns this guard off", confirm = "From its next tool call, no subagent is warned or refused for its context's growth, unless turns' guards.run names usage.ceiling." }

[ceiling.warn_tokens]
type = "int"
default = 0
doc = "Context growth in tokens at which a subagent is warned once, below hard_tokens; the ceiling acts only when this and hard_tokens are both above 0."
read = "use"
label = "Warn a subagent at"
common = true
unit = "tokens"

[ceiling.hard_tokens]
type = "int"
default = 0
doc = "Context growth in tokens past which a subagent's tools are refused, except handing off; the ceiling acts only when this and warn_tokens are both above 0."
read = "use"
label = "Refuse its tools past"
common = true
unit = "tokens"

[ceiling.return_tools]
type = "list"
items = "str"
default = ["StructuredOutput"]
doc = "Tools a subagent may always call, before any measurement, to return its result."
read = "use"
label = "Tools a subagent may always call"
group = "Worker ceiling"

[ceiling.warning_text]
type = "string"
default = "Worker context warning (usage's worker ceiling, set by whoever launched you): this worker has added {growth} input tokens since its first request (now {current}); hard stop at {hard} added. Do not start another slice or long proof. Finish the smallest safe unit, commit it, update the report with done, left, and where, then return to the parent."
doc = "The line added once when a subagent passes warn_tokens; {growth}, {current} and {hard} are filled in."
read = "use"
label = "The warning's words"
group = "Worker ceiling"

[ceiling.deny_text]
type = "string"
default = "Worker context ceiling reached (usage's worker ceiling, set by whoever launched you): this worker has added {growth} input tokens, hard stop {hard}. This tool is denied. Do not retry it and do not start more work. Wrap up only. (1) Inspect and commit the existing diff with git, naming the repository as `git -C <dir> ...` or `cd <dir> && git ...`; give the whole message in one -m in single quotes, newlines inside the quotes, with no heredoc, $ or backtick. (2) Get the commit line the same way: `cd <dir> && moxi repo rules`, or the command your brief names when it prints `no commit rules`. Put every trailer in the last paragraph of the one -m. (3) Update a Markdown report under an allowed hand-off root. (4) Return CEILING HANDOFF with done, commit or uncommitted state, report path, left, and the next first action. Do not run tests, source reads, searches, skills, web or MCP calls, or another agent."
doc = "The reason given for each tool call refused past hard_tokens; {growth}, {current} and {hard} are filled in."
read = "use"
label = "The refusal's words"
group = "Worker ceiling"

[ceiling.handoff_roots]
type = "list"
items = "str"
default = []
doc = "Directories under which a subagent past its ceiling may still read and write Markdown files, each an absolute path."
read = "use"
label = "Folders it may still write notes in"
group = "Worker ceiling"

[ceiling.work_roots]
type = "list"
items = "str"
default = []
doc = "Directories, besides the subagent's own working directory, in which a subagent past its ceiling may still run git status, diff, add and commit."
read = "use"
label = "Folders it may still commit in"
group = "Worker ceiling"

[ceiling.allow_commands]
type = "list"
default = [["moxi", "repo", "rules"]]
doc = "More commands a subagent past its ceiling may run, each the list of a whole command's words; the word <handoff> stands for a Markdown file's path under a handoff root, and any other word written <...>, such as <key>, for one name word."
read = "use"
label = "Commands it may still run"
group = "Worker ceiling"

[ceiling.max_age_days]
type = "int"
default = 7
doc = "Days a subagent's ceiling markers are kept; 1 or more."
read = "use"
label = "Keep ceiling markers for"
group = "Worker ceiling"
unit = "days"

# Keys an earlier usage read, kept declared so a file that still sets one is told what to
# do rather than refused as unknown.

[index.wait_seconds]
retired = "renamed: set index.wait_s instead"

[limits.codex_pull_after]
retired = "renamed: set limits.codex_pull_after_s instead"

[ceiling.on]
retired = "renamed: set ceiling.enabled instead"
