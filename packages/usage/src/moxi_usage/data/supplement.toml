# Model facts LiteLLM's price file lacks, laid over it when the model table is made
# (tools/models_from_litellm.py, and `moxi usage prices update`).
#
# Every row says where its facts came from (`source`) and when they were read (`as_of`).
# Prices are dollars per million tokens. A `[[model]]` row is laid over the LiteLLM row of
# the same id field by field (a tier by its name); `match = "prefix"` makes it a prefix
# row, looked up only after every other step fails, and its id must carry a digit.

schema = 1
as_of = "2026-10-30"

# Cache prices as multiples of the input price, by LiteLLM provider. They fill a cache
# price only where a model's row gives an input price and not that cache price.

[defaults.anthropic]
cache_read = 0.1
cache_write_5m = 1.25
cache_write_1h = 2.0
source = "Anthropic prompt caching pricing: cache reads 0.1x the base input price, 5-minute cache writes 1.25x, 1-hour cache writes 2x"
as_of = "2026-09-25"

[defaults.openai]
cache_write_5m = 1.0
cache_write_1h = 1.0
source = "OpenAI API pricing (developers.openai.com/api/docs/pricing): no separate cache-write price for these models; tokens written to the cache bill as input"
as_of = "2026-10-04"

# Bracket suffixes a harness adds to a model id. A variant's facts are laid over the base
# model's.

[variants."[1m]"]
window = 1000000
source = "Claude Code's [1m] model suffix names the 1M-token long-context variant, whatever window the base model's row gives"
as_of = "2026-08-14"

# Fast mode: the same model at a higher output speed, at premium prices. A request
# carries `speed = "fast"`. Cache prices take the provider's multipliers over the fast
# input price.

[[model]]
id = "claude-opus-5-5"
tiers.fast = { speed = "fast", input = 8.0, output = 40.0 }
source = "Anthropic API pricing, fast mode (research preview, Claude API only): Claude Opus 5.5 at $8 / $40 per million tokens, 2x standard"
as_of = "2026-09-25"

[[model]]
id = "claude-opus-5"
tiers.fast = { speed = "fast", input = 10.0, output = 50.0 }
source = "Anthropic API pricing, fast mode (research preview, Claude API only): Claude Opus 5 at $10 / $50 per million tokens"
as_of = "2026-09-25"

[[model]]
id = "claude-opus-4-8"
tiers.fast = { speed = "fast", input = 10.0, output = 50.0 }
source = "Anthropic API pricing, fast mode (research preview, Claude API only): Claude Opus 4.8 at $10 / $50 per million tokens"
as_of = "2026-06-24"

# Models newer than the LiteLLM snapshot, each a row of its own. A row carries every price
# the restart point's multipliers read (input, and with an input above 0 the cache-read and
# both cache-write prices), so none is filled from the provider's default.

[[model]]
id = "claude-fable-5-2"
provider = "anthropic"
input = 8.0
output = 40.0
cache_read = 0.2
cache_write_5m = 10.0
cache_write_1h = 16.0
window = 1000000
max_output = 128000
tiers.fast = { speed = "fast", input = 16.0, output = 80.0, cache_read = 0.4, cache_write_5m = 20.0, cache_write_1h = 32.0 }
source = "Anthropic API pricing (platform.claude.com/docs/en/about-claude/pricing) and models overview: Claude Fable 5.2 at $8 / $40 per million tokens, cache hits $0.20 (0.025x input), 5-minute cache writes $10, 1-hour $16; fast mode $16 / $80, with the same cache multipliers over the fast input price; 1M-token window, 128K max output"
as_of = "2026-11-20"

[[model]]
id = "claude-mythos-5-2"
provider = "anthropic"
input = 8.0
output = 40.0
cache_read = 0.2
cache_write_5m = 10.0
cache_write_1h = 16.0
window = 1000000
max_output = 128000
tiers.fast = { speed = "fast", input = 16.0, output = 80.0, cache_read = 0.4, cache_write_5m = 20.0, cache_write_1h = 32.0 }
source = "Anthropic API pricing (platform.claude.com/docs/en/about-claude/pricing) and models overview: Claude Mythos 5.2 (limited availability) at $8 / $40 per million tokens, cache hits $0.20 (0.025x input), 5-minute cache writes $10, 1-hour $16; fast mode $16 / $80, with the same cache multipliers over the fast input price; 1M-token window, 128K max output"
as_of = "2026-11-20"

# OpenCode's free models. A model with an input price of 0 has no write multiplier, so it
# carries input and output only.

[[model]]
id = "big-pickle"
provider = "opencode"
input = 0.0
output = 0.0
source = "OpenCode's model list (models.dev/api.json, provider opencode): Big Pickle, free ($0 input and output)"
as_of = "2026-11-20"

[[model]]
id = "minimax-m3.1-flash-free"
provider = "opencode"
input = 0.0
output = 0.0
source = "OpenCode's model list (models.dev/api.json, provider opencode): MiniMax M3.1 Flash Free, free ($0 input and output)"
as_of = "2026-11-20"

[[model]]
id = "space-bunny-free"
