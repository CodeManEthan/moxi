[project]
name = "moxi-usage"
version = "0.1.0"
description = "How much of each plan window is used, how full a session's context is, and what the tokens cost, from each harness's own records."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
dependencies = ["moxi>=0.1,<0.2", "moxi-sessions>=0.2,<0.3"]

[project.optional-dependencies]
turns = ["moxi-turns>=0.2,<0.3"]
projects = ["moxi-projects>=0.1,<0.2"]
# The browser UI shell: with it, the usage page and its limits and cost blocks show there.
# Loopback, which usage's page server runs on, comes with it.
ui = ["moxi-ui>=0.1,<0.2"]

[project.urls]
Homepage = "https://github.com/CodeManEthan/moxi"
Repository = "https://github.com/CodeManEthan/moxi"
Issues = "https://github.com/CodeManEthan/moxi/issues"

# The weekly restart-point measure, the command of the announcement's TIMERS.
[project.scripts]
moxi-usage-measure = "moxi_usage.measure:main"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
usage = "moxi_usage.module"

# usage's rows for turns' session events: the warn-at mark and the limits readings.
[project.entry-points."moxi.turns.listeners"]
usage = "moxi_usage.listeners"

# usage's guard for turns: the worker ceiling.
[project.entry-points."moxi.turns.guards"]
usage = "moxi_usage.guards"

[dependency-groups]
# moxi-ui's pytest plugin runs usage's page in a real shell; its testing extra brings the
# browser. The browser tests import Playwright themselves, so it is named too.
dev = ["pytest", "moxi-dev", "moxi-ui[testing]", "playwright>=1.56,<2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package directory whole, so data/ (the model table and its supplement) and
# settings.toml ship beside the code.
packages = ["src/moxi_usage"]

[tool.hatch.build.targets.sdist]
# A source distribution built from any branch holds only these paths; hatchling adds
# pyproject.toml and .gitignore itself.
only-include = ["LICENSE", "README.md", "conftest.py", "src/moxi_usage", "tests", "tools",
               "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not slow and not build and not live'"
