# The root of the uv workspace: the repository's root, a virtual one that names every
# package under packages/ as a member and holds no project of its own.
# Members are named one by one, never by a glob, and declare no [tool.uv.sources] of
# their own, so a package built or installed alone resolves its siblings from the index;
# the sources below exist only here, and make each member resolve to its directory in
# this tree. uv.lock beside this file is committed; .venv is derived and ignored.

[tool.uv.workspace]
members = [
    "packages/moxi",
    "packages/sessions",
    "packages/turns",
    "packages/cache",
    "packages/comms",
    "packages/usage",
    "packages/moxi-dev",
    "packages/launcher",
    "packages/repo",
    "packages/secrets",
    "packages/projects",
    "packages/slots",
    "packages/services",
    "packages/ui",
    "packages/notes",
    "packages/loadout",
    "packages/tunnel",
    "packages/connector",
    "packages/rounds",
    "packages/publishing",
    "packages/statusline",
]

[tool.uv.sources]
moxi = { workspace = true }
moxi-sessions = { workspace = true }
moxi-turns = { workspace = true }
moxi-cache = { workspace = true }
moxi-comms = { workspace = true }
moxi-usage = { workspace = true }
moxi-dev = { workspace = true }
moxi-launcher = { workspace = true }
moxi-repo = { workspace = true }
moxi-secrets = { workspace = true }
moxi-projects = { workspace = true }
moxi-slots = { workspace = true }
moxi-services = { workspace = true }
moxi-ui = { workspace = true }
moxi-notes = { workspace = true }
moxi-loadout = { workspace = true }
moxi-tunnel = { workspace = true }
moxi-connector = { workspace = true }
moxi-rounds = { workspace = true }
moxi-publishing = { workspace = true }
moxi-statusline = { workspace = true }

# The contributor's tools: `uv sync` installs moxi-dev, whose `moxi-dev check` runs the
# checks a change must pass.
[dependency-groups]
dev = ["moxi-dev"]

# Release settings, read by moxi-publishing's tag gate at the tagged commit. A package on
# not-ready is never released from a commit that lists it; it moves to ready by its own
# commit once confirmed. Every member is on exactly one of the two lists: a member added
# to the workspace goes on not-ready with it, and moxi-dev check refuses one on neither.
# check-workflow and check-job name the CI job whose success on a push to main the gate
# wants at the tagged commit.
[tool.moxi-publishing]
not-ready = [
    "moxi",
    "moxi-sessions",
    "moxi-turns",
    "moxi-cache",
    "moxi-comms",
    "moxi-usage",
    "moxi-dev",
    "moxi-launcher",
    "moxi-repo",
    "moxi-secrets",
    "moxi-projects",
    "moxi-slots",
    "moxi-services",
    "moxi-ui",
    "moxi-notes",
    "moxi-loadout",
    "moxi-tunnel",
    "moxi-connector",
    "moxi-rounds",
    "moxi-publishing",
    "moxi-statusline",
]
ready = []
check-workflow = "ci.yml"
check-job = "linux"

[tool.ruff]
extend-exclude = ["packages/moxi/src/moxi/_vendor"]

[tool.ruff.lint]
select = ["N", "A", "FBT"]
ignore = ["N818"]
external = ["MX"]

[tool.ruff.lint.flake8-boolean-trap]
extend-allowed-calls = ["os.set_inheritable", "os.set_handle_inheritable"]
