# The same check a contributor runs before asking for a merge: `moxi-dev check`.
# Linux runs on every push to any branch; Windows and macOS run on pushes to main,
# after the merge, and gate nothing while the packages are Linux-only.
# Actions are pinned to a release commit, with its version beside it.

name: check

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked
      - name: check the change against main
        if: github.ref != 'refs/heads/main'
        run: uv run --locked moxi-dev check --base origin/main
      - name: check everything
        if: github.ref == 'refs/heads/main'
        run: uv run --locked moxi-dev check --full

  other:
    if: github.ref == 'refs/heads/main'
    # Linux-only packages today: these runs report and gate nothing.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - name: install tmux, which the slots tests drive
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: uv sync --locked
      - run: uv run --locked moxi-dev check --full
