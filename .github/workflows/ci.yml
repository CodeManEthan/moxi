# The same check a contributor runs before asking for a merge: `moxi-dev check`.
# Linux runs on every push to any branch; Windows and macOS run on pushes to main,
# after the merge, and gate nothing while the packages are Linux-only.
# The web job runs on all three systems on every push: the web pages' built files must be
# what the pinned Node toolchain makes from their sources, byte for byte.
# Actions are pinned to a release commit, with its version beside it.

name: check

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked
      - name: check the change against main
        if: github.ref != 'refs/heads/main'
        run: uv run --locked moxi-dev check --base origin/main
      - name: check everything
        if: github.ref == 'refs/heads/main'
        run: uv run --locked moxi-dev check --full

  other:
    if: github.ref == 'refs/heads/main'
    # Linux-only packages today: these runs report and gate nothing.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked moxi-dev check --full

  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: type-check each page, build into a temp directory, compare with the tree
        run: npm run check
      - name: each page's own Node tests
        run: npm test --workspaces --if-present
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      # The pre-commit check's own code, standard library only: its stamp must equal the
      # one the build wrote, on this system too.
      - name: the build stamps, recomputed without Node
        env:
          PYTHONPATH: packages/moxi-dev/src
        run: uv run --no-project --python 3.12 python -m moxi_dev.stamp
