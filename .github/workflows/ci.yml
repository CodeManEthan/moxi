# The same check a contributor runs before asking for a merge: `moxi-dev check`.
# Linux runs on every push to any branch; Windows and macOS run on pushes to main,
# after the merge, and to a ci-full/ branch, and gate nothing while the packages are
# Linux-only. secrets' tests also run in a Windows job of their own, on the same terms:
# on pushes to main and to a ci-full/ branch, gating nothing, with only secrets and what
# it needs installed and line-ending conversion on.
# The web job runs on all three systems on every push but one to a ci/ branch: the web
# pages' built files must be what the pinned Node toolchain makes from their sources,
# byte for byte.
# A ci/ branch carries a build's tip for rounds to read, so there the linux job runs the
# full check, as on main, and the web job runs on Linux only. A ci-full/ branch carries
# a commit pushed by hand to get the run main gets, on all three systems, before main
# moves: there every job runs as on main. A newer push to a ci/ or ci-full/ branch
# cancels the run of that branch still going; a run of any other ref shares its
# concurrency group with no other run, so none of main's or a tag's is ever cancelled.
# Every job skips the push that deletes a branch.
# The browser jobs run the browser tests: every page package's in Chromium and Firefox on
# Linux on every push, gating; ui's in Chromium on Windows and macOS and WebKit on macOS
# on pushes to main and to a ci-full/ branch, gating nothing. They run in the full
# workspace, every package with every extra, as `moxi-dev check` installs it: the tests
# are written against it.
# Actions are pinned to a release commit, with its version beside it.

name: check

on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ (startsWith(github.ref, 'refs/heads/ci/') || startsWith(github.ref, 'refs/heads/ci-full/')) && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GitHub's runners are slower than the machine the timed tests' budgets were set on:
  # every upper bound of a timed test is multiplied by this factor.
  MOXI_TEST_TIMED_SLACK: "2"

jobs:
  linux:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked
      - name: check the change against main
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/ci/') && !startsWith(github.ref, 'refs/heads/ci-full/')
        run: uv run --locked moxi-dev check --base origin/main
      - name: check everything
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/') || startsWith(github.ref, 'refs/heads/ci-full/')
        run: uv run --locked moxi-dev check --full

  other:
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci-full/')) && !github.event.deleted
    # Linux-only packages today: these runs report and gate nothing.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - name: install tmux, which the slots tests drive
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: uv sync --locked
      - run: uv run --locked moxi-dev check --full

  web:
    if: ${{ !github.event.deleted }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ startsWith(github.ref, 'refs/heads/ci/') && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # A checkout that converts line endings must leave the built files and the stamp's
      # inputs alone, so conversion is turned on before it, on every system, rather than
      # left to the image's default.
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: type-check each page, build into a temp directory, compare with the tree
        run: npm run check
      - name: each page's own Node tests
        run: npm test --workspaces --if-present
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      # The pre-commit check's own code, standard library only: its stamp must equal the
      # one the build wrote, on this system too.
      - name: the build stamps, recomputed without Node
        env:
          PYTHONPATH: packages/moxi-dev/src
        run: uv run --no-project --python 3.12 python -m moxi_dev.stamp

  browser:
    # Each page package's browser tests, in a real browser through Playwright: Chromium
    # and Firefox on Linux, on every push, gating. moxi-dev check runs them only where
    # Chromium is installed, which the linux job's runner is not. Each runs from its
    # package's directory in the full workspace, every package with every extra, which
    # is what moxi-dev check syncs.
    if: ${{ !github.event.deleted }}
    strategy:
      fail-fast: false
      matrix:
        package: [ui, cache, comms, launcher, usage, loadout, projects, sessions, turns, services, connector]
        engine: [chromium, firefox]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked --all-packages --all-extras
      - name: install the browser and the system libraries it needs
        working-directory: packages/${{ matrix.package }}
        run: uv run --locked --all-packages --all-extras playwright install --with-deps ${{ matrix.engine }}
      # The browser tests run without the theme's first font, Adwaita Sans, in the face the
      # runner falls back to, DejaVu Sans, so a layout that holds only in Adwaita's widths
      # fails here. A runner image that gains Adwaita fails the job rather than hide that.
      - name: the fallback fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-dejavu-core
      - name: the theme's first font is not installed
        run: |
          family="$(fc-match -f '%{family}' 'Adwaita Sans')"
          echo "Adwaita Sans resolves to: ${family:-nothing}"
          case "$family" in
            "") echo "fc-match found no font for Adwaita Sans"; exit 1 ;;
            *Adwaita*) echo "this runner has Adwaita, so the layouts would not meet a fallback face"; exit 1 ;;
          esac
      - name: the browser tests
        working-directory: packages/${{ matrix.package }}
        run: uv run --locked --all-packages --all-extras pytest -m browser --ui-browser ${{ matrix.engine }} -n auto --ui-traces ui-traces
      - name: a failed test's Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ui-traces-${{ matrix.package }}-${{ matrix.engine }}
          path: packages/${{ matrix.package }}/ui-traces
          if-no-files-found: ignore

  browser-other:
    # ui's tests in Chromium on Windows and macOS, and in WebKit on macOS, in the full
    # workspace like the Linux ones. Like the other non-Linux runs, on pushes to main and
    # to a ci-full/ branch, gating nothing.
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci-full/')) && !github.event.deleted
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            engine: chromium
          - os: macos-latest
            engine: chromium
          - os: macos-latest
            engine: webkit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked --all-packages --all-extras
      - name: install the browser and the system libraries it needs
        working-directory: packages/ui
        run: uv run --locked --all-packages --all-extras playwright install --with-deps ${{ matrix.engine }}
      - name: the browser tests
        working-directory: packages/ui
        run: uv run --locked --all-packages --all-extras pytest -m browser --ui-browser ${{ matrix.engine }} -n auto --ui-traces ui-traces
      - name: a failed test's Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ui-traces-${{ matrix.os }}-${{ matrix.engine }}
          path: packages/ui/ui-traces
          if-no-files-found: ignore

  secrets-windows:
    # The secrets rule files are compared byte for byte (the pin's sha256, the
    # sets.json regeneration). A Windows checkout that rewrites line endings must
    # leave them alone, so line-ending conversion is turned on before the checkout.
    # Only secrets is synced, so another package failing on Windows does not fail
    # this job.
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci-full/')) && !github.event.deleted
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked --package moxi-secrets
      - name: the secrets tests
        working-directory: packages/secrets
        run: uv run --locked --package moxi-secrets pytest
